<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WNFX - Jasa Susun Chord</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #14171C;
            --accent-green: #23C55E;
            --text-main: #FFFFFF;
            --text-muted: #636E7A;
            --bg-card: #090A0C;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            background: linear-gradient(180deg, #1A1E26 0%, var(--bg-main) 300px);
            min-height: 100vh;
            padding-bottom: 40px;
            position: relative;
        }

        /* HEADER */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 25px 20px;
            position: sticky;
            top: 0;
            background-color: rgba(20, 23, 28, 0.9);
            backdrop-filter: blur(15px);
            z-index: 100;
        }

        .home-btn {
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: opacity 0.3s;
        }

        .home-btn:hover { opacity: 0.7; }

        .brand {
            font-weight: 800;
            font-size: 20px;
            letter-spacing: 1px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        /* SECTION INFO */
        .section-info {
            padding: 30px 20px;
            text-align: center;
        }

        .section-info h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .section-info p {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.6;
        }

        /* FORM STYLING */
        .order-form {
            padding: 20px;
            margin: 0 20px;
            background: var(--bg-card);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .form-group input {
            width: 100%;
            background: #14171C;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 14px;
            border-radius: 12px;
            color: white;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            border-color: var(--accent-green);
        }

        .btn-submit {
            width: 100%;
            background: var(--accent-green);
            color: white;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            transition: transform 0.2s;
            box-shadow: 0 10px 20px rgba(35, 197, 94, 0.2);
        }

        .btn-submit:active { transform: scale(0.98); }

        /* MODAL CSS (CUSTOM ALERT) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 20px;
        }

        .modal-content {
            background: #090A0C;
            border: 1px solid var(--accent-green);
            padding: 30px;
            border-radius: 24px;
            text-align: center;
            width: 100%;
            max-width: 400px;
            animation: modalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes modalPop {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-content i {
            font-size: 50px;
            color: var(--accent-green);
            margin-bottom: 20px;
        }

        .modal-content h3 { margin-bottom: 10px; font-size: 20px; }
        .modal-content p { color: var(--text-muted); font-size: 14px; margin-bottom: 25px; line-height: 1.5; }

        .btn-modal {
            background: var(--accent-green);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
        }

        /* DECOR */
        .fixed-bg-decor {
            position: absolute;
            z-index: 0;
            opacity: 0.03;
            pointer-events: none;
            filter: invert(1);
        }
        .decor-1 { top: 150px; right: -20px; width: 100px; transform: rotate(15deg); }
        .decor-2 { bottom: 100px; left: -20px; width: 120px; transform: rotate(-15deg); }

    </style>
</head>
<body>

    <div class="app-container">
        <img src="https://cdn-icons-png.flaticon.com/512/26/26274.png" class="fixed-bg-decor decor-1">
        <img src="https://cdn-icons-png.flaticon.com/512/651/651717.png" class="fixed-bg-decor decor-2">

        <header>
            <div class="home-btn" onclick="location.href='index.html'">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: white;">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
            </div>
            <span class="brand">WNFX</span>
            <div style="width: 22px;"></div> </header>

        <div class="section-info">
            <h1>Jasa Susun Chord</h1>
            <p>Bantu susun alur nada yang pas untuk lagu kamu agar terdengar lebih profesional.</p>
        </div>

        <div class="order-form">
            <div class="form-group">
                <label>Nama Anda</label>
                <input type="text" id="custName" placeholder="Masukkan nama kamu...">
            </div>
            <div class="form-group">
                <label>Link Musik / Lagu</label>
                <input type="url" id="musicLink" placeholder="Tempel link Google Drive/YouTube/Lainnya...">
            </div>
            <button class="btn-submit" id="btnSubmit" onclick="sendOrder()">
                <i class="fa-solid fa-paper-plane"></i> Pesan Sekarang
            </button>
        </div>
    </div>

    <div class="modal-overlay" id="orderModal">
        <div class="modal-content">
            <i class="fa-solid fa-circle-check"></i>
            <h3>Berhasil Terkirim!</h3>
            <p>Terima kasih telah order, Om! Pesanan kamu sedang masuk antrian dan akan segera diproses oleh admin.</p>
            <button class="btn-modal" onclick="location.href='riwayat.html'">OK, SIAP!</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAaPyl0-gKKhxKjhyCmqduUF11N6C1ngZ4",
            authDomain: "omwnfx1.firebaseapp.com",
            projectId: "omwnfx1",
            databaseURL: "https://omwnfx1-default-rtdb.asia-southeast1.firebasedatabase.app",
            storageBucket: "omwnfx1.firebasestorage.app",
            messagingSenderId: "1063248927187",
            appId: "1:1063248927187:web:6bd23f24517b1c2d53b726"
        };

        const app = initializeApp(firebaseConfig);
        const rtdb = getDatabase(app);
        const auth = getAuth(app);

        let currentUser = null;
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
        });

        window.sendOrder = async () => {
            const name = document.getElementById('custName').value;
            const link = document.getElementById('musicLink').value;
            const btn = document.getElementById('btnSubmit');

            if (!name || !link) {
                alert("Mohon isi semua data!");
                return;
            }

            if (!currentUser) {
                alert("Silakan login terlebih dahulu!");
                window.location.href = "login.html";
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memproses...';

            try {
                // 1. Simpan ke Firebase Realtime Database
                const orderRef = ref(rtdb, 'orders');
                const newOrderRef = push(orderRef);
                await set(newOrderRef, {
                    userId: currentUser.uid,
                    customerName: name,
                    judulProject: "Jasa Susun Chord",
                    kategori: "chord",
                    musicLink: link,
                    status: "pending",
                    createdAt: serverTimestamp()
                });

                // 2. Tampilkan Custom Modal (Ganti Redirect WA)
                document.getElementById('orderModal').style.display = 'flex';

            } catch (error) {
                console.error("Error:", error);
                alert("Gagal mengirim pesanan.");
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Pesan Sekarang';
            }
        };
    </script>
</body>
</html>
