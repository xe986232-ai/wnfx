<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Musik - WNFX</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* BASE STYLE */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #14171C;
            color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(180deg, #1A1E26 0%, #14171C 300px);
        }

        /* HEADER */
        header {
            width: 100%;
            max-width: 500px;
            display: flex;
            align-items: center;
            padding: 25px 20px;
            position: sticky;
            top: 0;
            background-color: rgba(20, 23, 28, 0.9);
            backdrop-filter: blur(15px);
            z-index: 1000;
        }

        .home-btn {
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: transform 0.3s cubic-bezier(0.68, -0.6, 0.32, 1.6);
        }
        .home-btn:active { transform: scale(0.8); }

        .page-title {
            font-weight: 800;
            font-size: 18px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            letter-spacing: 1px;
            white-space: nowrap;
        }

        /* CONTENT CONTAINER */
        main {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        .section-header {
            margin-bottom: 30px;
            text-align: center;
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-header h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .section-header p {
            font-size: 14px;
            color: #636E7A;
            line-height: 1.5;
        }

        /* ORDER CARD */
        .order-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .order-card {
            background-color: #090A0C;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: cardSlide 0.5s ease forwards;
            opacity: 0;
        }

        @keyframes cardSlide {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .order-card:hover {
            border-color: #23C55E;
            transform: scale(1.02);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .order-info h3 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 4px;
            color: #FFFFFF;
        }

        .order-details {
            font-size: 12px;
            color: #636E7A;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .detail-badge {
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 8px;
            border-radius: 5px;
            font-size: 11px;
            color: #23C55E;
            margin-right: 5px;
        }

        /* STATUS BADGE */
        .status-badge {
            font-size: 10px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 10px;
            text-transform: uppercase;
        }

        .status-pending { background: rgba(255, 255, 255, 0.05); color: #636E7A; border: 1px solid rgba(255, 255, 255, 0.1); }
        .status-process { background: rgba(35, 197, 94, 0.1); color: #23C55E; border: 1px solid rgba(35, 197, 94, 0.2); }
        .status-completed { background: rgba(35, 197, 94, 0.1); color: #23C55E; border: 1px solid rgba(35, 197, 94, 0.2); }
        .status-rejected { background: rgba(255, 255, 255, 0.05); color: #636E7A; border: 1px solid rgba(255, 255, 255, 0.1); }

        /* INTERACTION TEXT */
        .action-text {
            font-size: 11px;
            font-weight: 700;
            text-decoration: underline;
            cursor: pointer;
            margin-left: 10px;
            transition: 0.3s;
        }
        .text-reject { color: #636E7A; }
        .text-success { color: #23C55E; }

        /* OVERLAY MODAL */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
        }
        .overlay-content {
            background: #14171C;
            border-radius: 25px;
            padding: 25px;
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            animation: zoomIn 0.3s ease;
        }
        @keyframes zoomIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        
        .close-overlay {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 20px;
            color: #636E7A;
            cursor: pointer;
        }

        .price-tag {
            font-size: 24px;
            font-weight: 800;
            color: #23C55E;
            margin: 15px 0;
            display: block;
        }

        /* WA BUTTON */
        .btn-wa {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #23C55E;
            color: #FFFFFF;
            text-decoration: none;
            font-weight: 800;
            font-size: 14px;
            padding: 15px;
            border-radius: 15px;
            margin-top: 20px;
            transition: 0.3s;
        }
        .btn-wa:active { transform: scale(0.95); }
        .btn-wa svg { width: 20px; height: 20px; fill: currentColor; }

        /* DOWNLOAD AREA */
        .download-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #14171C; /* Background dari palet yang diminta */
            padding: 15px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            margin-top: 5px;
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            font-weight: 600;
        }

        .file-info i { color: #23C55E; font-size: 15px; }
        .file-info i.fa-circle-xmark { color: #636E7A; }
        .file-info i.fa-circle-notch { color: #23C55E; }

        .btn-download {
            background: #23C55E;
            color: #FFFFFF;
            text-decoration: none;
            font-size: 13px;
            font-weight: 800;
            padding: 10px 22px;
            border-radius: 14px;
            transition: 0.3s;
        }

        .btn-download.disabled {
            background: rgba(255, 255, 255, 0.05); /* Menggunakan alpha dari putih sesuai palet */
            color: #636E7A;
            pointer-events: none;
            box-shadow: none;
        }

        /* EMPTY STATE */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }
        .empty-state i { font-size: 50px; color: #14171C; margin-bottom: 20px; }
        .empty-state p { color: #636E7A; font-size: 14px; }
    </style>
</head>
<body>

    <header>
        <div class="home-btn" onclick="location.href='index.html'">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: white;">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
        </div>
        <span class="page-title">WNFX MUSIC</span>
    </header>

    <main>
        <div class="section-header">
            <h1>Riwayat Musik</h1>
            <p>Pantau proses pembuatan melodi dan style pesananmu.</p>
        </div>

        <div class="order-list" id="orderContainer">
            <div class="empty-state" id="loader">
                <i class="fa-solid fa-circle-notch fa-spin"></i>
                <p>Memuat riwayat musik...</p>
            </div>
        </div>
    </main>

    <div class="overlay" id="infoOverlay">
        <div class="overlay-content">
            <span class="close-overlay" onclick="closeOverlay()">&times;</span>
            <h3 id="overlayTitle">Informasi</h3>
            <hr style="opacity: 0.1; margin: 15px 0;">
            <div id="overlayBody"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, query, orderByChild, equalTo, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAaPyl0-gKKhxKjhyCmqduUF11N6C1ngZ4",
            authDomain: "omwnfx1.firebaseapp.com",
            databaseURL: "https://omwnfx1-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "omwnfx1",
            storageBucket: "omwnfx1.firebasestorage.app",
            messagingSenderId: "1063248927187",
            appId: "1:1063248927187:web:6bd23f24517b1c2d53b726"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const orderContainer = document.getElementById('orderContainer');

        // Fungsi Overlay
        window.showRejectInfo = (msg) => {
            document.getElementById('overlayTitle').innerText = "Alasan Penolakan";
            document.getElementById('overlayBody').innerHTML = `<p style="line-height:1.6; color:#636E7A;">${msg}</p>`;
            document.getElementById('infoOverlay').style.display = 'flex';
        }

        window.showSuccessInfo = (price, msg, orderId) => {
            const waNumber = "6283129555763";
            const waText = window.encodeURIComponent(`Halo Admin WNFX, saya ingin mengirimkan bukti pembayaran untuk pesanan ID: ${orderId}\nTotal Tagihan: Rp ${Number(price).toLocaleString('id-ID')}`);
            
            document.getElementById('overlayTitle').innerText = "Tebus Pesanan";
            document.getElementById('overlayBody').innerHTML = `
                <p style="font-size:12px; color:#636E7A;">Total yang harus dibayar:</p>
                <span class="price-tag">Rp ${Number(price).toLocaleString('id-ID')}</span>
                <p style="line-height:1.6; font-size:14px; margin-bottom:15px; color:#FFFFFF;">${msg}</p>
                <p style="font-size:11px; color:#636E7A; font-style:italic;">*Silahkan klik tombol di bawah untuk mengirim bukti pembayaran ke WhatsApp admin.</p>
                
                <a href="https://wa.me/${waNumber}?text=${waText}" class="btn-wa" target="_blank">
                    <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                    Kirim Bukti Pembayaran
                </a>
            `;
            document.getElementById('infoOverlay').style.display = 'flex';
        }

        window.closeOverlay = () => {
            document.getElementById('infoOverlay').style.display = 'none';
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                const musicRef = ref(db, 'requestmusic');
                const qMusic = query(musicRef, orderByChild('userId'), equalTo(user.uid));

                onValue(qMusic, (snapshot) => {
                    orderContainer.innerHTML = '';
                    
                    if (!snapshot.exists()) {
                        orderContainer.innerHTML = `
                            <div class="empty-state">
                                <i class="fa-solid fa-music"></i>
                                <p>Belum ada request musik.</p>
                            </div>`;
                        return;
                    }

                    let musicOrders = [];
                    snapshot.forEach((child) => {
                        musicOrders.push({ id: child.key, ...child.val() });
                    });

                    musicOrders.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

                    musicOrders.forEach((data, index) => {
                        const isSuccess = data.status === 'success';
                        const isRejected = data.status === 'rejected';
                        const isProcess = data.status === 'process';
                        
                        let statusClass = 'status-pending';
                        let statusLabel = data.status || 'pending';

                        if(isSuccess) { statusClass = 'status-completed'; statusLabel = 'success'; }
                        if(isProcess) statusClass = 'status-process';
                        if(isRejected) statusClass = 'status-rejected';
                        
                        // MODIFIKASI: Menyesuaikan judul kategori dengan awalan "request"
                        let categoryDisplay = "Request Musik";
                        if (data.kategori === "vocal") {
                            categoryDisplay = "Request Vocal/Acapella";
                        } else if (data.kategori === "music") {
                            categoryDisplay = "Request Music";
                        } else if (data.type) {
                            categoryDisplay = "Request " + data.type;
                        }

                        const date = data.timestamp ? new Date(data.timestamp).toLocaleDateString('id-ID', {
                            day: 'numeric', month: 'short', year: 'numeric'
                        }) : '-';

                        const subDetail = data.genre ? `Genre: ${data.genre}` : (data.mode === 'link' ? 'Via Link Referensi' : 'Via Audio Upload');
                        const duration = data.durasi ? `<span class="detail-badge">${data.durasi} Menit</span>` : '';

                        // Logic Icon File Info
                        let fileIcon = 'fa-clock';
                        let fileText = 'Menunggu Peninjauan';
                        if(isProcess) { fileIcon = 'fa-circle-notch fa-spin'; fileText = 'Sedang Diproses'; }
                        if(isSuccess) { fileIcon = 'fa-circle-check'; fileText = 'Musik Selesai'; }
                        if(isRejected) { fileIcon = 'fa-circle-xmark'; fileText = 'Ditolak'; }

                        const cardHTML = `
                            <div class="order-card" style="animation-delay: ${index * 0.1}s">
                                <div class="order-header">
                                    <div class="order-info">
                                        <div style="display:flex; align-items:center;">
                                            <h3>${categoryDisplay}</h3>
                                            ${isRejected ? `<span class="action-text text-reject" onclick="showRejectInfo('${data.alasan || 'Tidak ada alasan spesifik.'}')">lihat alasan</span>` : ''}
                                            ${isSuccess ? `<span class="action-text text-success" onclick="showSuccessInfo('${data.total_harga || 0}', '${data.pesan_selesai || 'Pesanan Anda telah siap.'}', '${data.orderId}')">tebus pesanan</span>` : ''}
                                        </div>
                                        <span class="order-details" style="font-size: 11px;">${date} • Antrian #${data.antrian || '0'}</span>
                                    </div>
                                    <span class="status-badge ${statusClass}">
                                        ${statusLabel}
                                    </span>
                                </div>

                                <div class="order-details">
                                    <span class="detail-badge">${subDetail}</span>
                                    ${duration}
                                </div>
                                
                                <div class="download-section">
                                    <div class="file-info">
                                        <i class="fa-solid ${fileIcon}"></i>
                                        <span style="color: ${isSuccess ? '#FFFFFF' : (isRejected ? '#636E7A' : (isProcess ? '#23C55E' : '#636E7A'))}">
                                            ${fileText}
                                        </span>
                                    </div>
                                    <a href="${isSuccess && data.downloadLink ? data.downloadLink : '#'}" 
                                       class="btn-download ${isSuccess && data.downloadLink ? '' : 'disabled'}" 
                                       target="_blank">
                                       Ambil
                                    </a>
                                </div>
                            </div>
                        `;
                        orderContainer.insertAdjacentHTML('beforeend', cardHTML);
                    });
                });
            } else {
                window.location.href = "login.html";
            }
        });
    </script>
</body>
</html>
