<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XgusXG | My Orders</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script type="module" crossorigin src="./assets/transaksi-CjLjveTg.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/index.esm-CvrxiNIc.js">
  <link rel="stylesheet" crossorigin href="./assets/transaksi-CJ0dvEcB.css">
</head>
<body>

    <nav class="navbar">
        <div class="brand">XgusXG<span>Orders</span></div>
        <div class="nav-right" style="display:flex; gap:15px; font-size:18px;">
            <i class="fa-solid fa-rotate-right" id="btnRefresh" style="cursor:pointer; color:#555; transition:0.3s;" title="Refresh"></i>
        </div>
    </nav>

    <header class="page-header">
        <h1>My Orders</h1>
        <p>Track all your purchase history here.</p>
    </header>

    <!-- USER CARD -->
    <div class="user-card" id="userCard" style="display:none; width:calc(100% - 40px);">
        <div class="user-avatar" id="userAvatarLetter">?</div>
        <div class="user-meta">
            <div class="u-name" id="userNameDisplay">-</div>
            <div class="u-uid" id="userUIDDisplay">-</div>
        </div>
        <button class="btn-logout" onclick="logoutUser()">Ganti Nama</button>
    </div>

    <!-- STATS -->
    <div class="stats-row" id="statsRow" style="display:none;">
        <div class="stat-box">
            <div class="s-num" id="statTotal">0</div>
            <div class="s-label">Total Order</div>
        </div>
        <div class="stat-box">
            <div class="s-num" id="statPending">0</div>
            <div class="s-label">Pending</div>
        </div>
        <div class="stat-box">
            <div class="s-num" id="statDone">0</div>
            <div class="s-label">Selesai</div>
        </div>
    </div>

    <!-- SECTION LABEL -->
    <div class="section-label" id="sectionLabel" style="display:none;">
        <span>Riwayat Pesanan</span>
        <small id="orderCountLabel">0 transaksi</small>
    </div>

    <!-- ORDER LIST -->
    <div class="order-list" id="orderList">
        <!-- skeleton loading -->
        <div class="skeleton-card">
            <div class="skel skel-icon"></div>
            <div class="skel-lines">
                <div class="skel skel-line" style="width:70%;"></div>
                <div class="skel skel-line short"></div>
            </div>
            <div class="skel-right">
                <div class="skel skel-price"></div>
                <div class="skel skel-badge"></div>
            </div>
        </div>
        <div class="skeleton-card">
            <div class="skel skel-icon"></div>
            <div class="skel-lines">
                <div class="skel skel-line" style="width:60%;"></div>
                <div class="skel skel-line short"></div>
            </div>
            <div class="skel-right">
                <div class="skel skel-price"></div>
                <div class="skel skel-badge"></div>
            </div>
        </div>
        <div class="skeleton-card">
            <div class="skel skel-icon"></div>
            <div class="skel-lines">
                <div class="skel skel-line" style="width:80%;"></div>
                <div class="skel skel-line short"></div>
            </div>
            <div class="skel-right">
                <div class="skel skel-price"></div>
                <div class="skel skel-badge"></div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fa-solid fa-house-chimney"></i><span>Home</span></a>
        <a href="produk.html" class="nav-item"><i class="fa-solid fa-layer-group"></i><span>Products</span></a>
        <a href="transaksi.html" class="nav-item active"><i class="fa-solid fa-cart-shopping"></i><span>Orders</span></a>
    </nav>
</body>
</html>
