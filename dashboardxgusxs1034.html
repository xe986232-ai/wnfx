<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XgusXG | Admin Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
    --bg-black: #050505;
    --card-bg: #111111;
    --card-bg-2: #14171C;
    --accent-mint: #00f3bc;
    --accent-gradient: linear-gradient(135deg, #e0ff99 0%, #00f3bc 100%);
    --shadow-glow: 0 8px 25px rgba(0, 243, 188, 0.25);
    --text-muted: #888;
    --border-dim: #222;
    --danger: #ff4757;
    --blue: #3B82F6;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; outline:none; font-family:'Inter',sans-serif; }
body {
    background-color: var(--bg-black);
    color:#fff;
    display:flex; flex-direction:column; align-items:center;
    padding-bottom: 110px;
}

/* NAVBAR */
.navbar {
    width:100%; max-width:600px;
    display:flex; justify-content:space-between; align-items:center;
    padding:18px 20px;
    background: rgba(5,5,5,0.85);
    backdrop-filter: blur(8px);
    position:sticky; top:0; z-index:1000;
    border-bottom:1px solid rgba(255,255,255,0.05);
}
.brand { display:flex; align-items:center; font-size:20px; font-weight:800; letter-spacing:-0.5px; }
.brand-icon {
    width:36px; height:36px; border-radius:50%;
    background: var(--accent-gradient);
    display:flex; align-items:center; justify-content:center;
    color:#000; font-weight:900; font-size:14px;
    margin-right:10px;
    box-shadow: 0 0 10px rgba(0,243,188,0.3);
}
.brand span { color: var(--accent-mint); }
.nav-right i { font-size:18px; color:#fff; }

/* TABS */
.tab-wrapper {
    width:100%; max-width:600px; padding:20px 20px 0;
}
.nav-tabs {
    display:flex; gap:8px;
    background: var(--card-bg);
    padding:6px; border-radius:14px;
    border:1px solid var(--border-dim);
    overflow-x:auto;
    scrollbar-width:none;
}
.nav-tabs::-webkit-scrollbar{display:none;}
.tab-btn {
    flex:1; white-space:nowrap;
    background:none; border:none; color:var(--text-muted);
    padding:10px 14px; cursor:pointer; font-weight:700; font-size:12px;
    border-radius:10px; transition:0.3s;
}
.tab-btn.active {
    background: var(--accent-gradient);
    color:#000;
    box-shadow: var(--shadow-glow);
}

.container { width:100%; max-width:600px; padding:20px; }
.tab-content { display:none; }
.tab-content.active { display:block; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

.section-title {
    font-size:18px; font-weight:800; margin-bottom:15px;
    display:flex; align-items:center; gap:8px;
}
.section-title::before {
    content:""; width:4px; height:16px; background:var(--accent-mint); border-radius:10px; display:inline-block;
}

/* ===== ORDERS / GROUPED ===== */
.user-group { background:var(--card-bg); border-radius:14px; border:1px solid var(--border-dim); margin-bottom:12px; overflow:hidden; }
.group-header { padding:15px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; background:rgba(255,255,255,0.02); transition:0.2s; }
.group-header:hover { background:rgba(255,255,255,0.05); }
.user-info { display:flex; align-items:center; gap:12px; }
.user-badge { width:36px; height:36px; background:var(--accent-gradient); border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; color:#000; overflow:hidden; object-fit:cover; }
.order-count { font-size:11px; background:var(--blue); color:white; padding:3px 10px; border-radius:20px; font-weight:700; }
.group-content { display:none; padding:15px; border-top:1px solid var(--border-dim); background:#0a0a0a; }
.group-content.open { display:block; }

.order-item { border-left:2px solid var(--accent-mint); padding-left:15px; margin-bottom:20px; position:relative; }
.order-item:last-child { margin-bottom:0; }

.btn-delete-order { position:absolute; top:0; right:0; padding:5px; background:transparent; border:none; color:var(--text-muted); cursor:pointer; transition:0.3s; }
.btn-delete-order:hover { color:var(--danger); }

.action-btns { display:flex; gap:8px; margin-top:10px; }
.btn-confirm { flex:1; padding:11px; background:var(--accent-gradient); border:none; border-radius:10px; color:#000; font-weight:800; cursor:pointer; font-size:12px; transition:0.3s; display:flex; align-items:center; justify-content:center; gap:8px; box-shadow:var(--shadow-glow); }
.btn-confirm:disabled { background:#444; color:#999; cursor:not-allowed; box-shadow:none; }

.kat-badge { font-size:9px; padding:2px 6px; border-radius:4px; text-transform:uppercase; font-weight:800; margin-left:8px; vertical-align:middle; }
.kat-vocal { background:#9333ea; color:white; }
.kat-chord { background:#ea580c; color:white; }
.kat-project { background:var(--blue); color:white; }

.upload-area { margin-top:8px; background:rgba(255,255,255,0.04); padding:10px; border-radius:10px; border:1px solid var(--border-dim); }
.upload-area label { font-size:10px; color:var(--text-muted); display:block; margin-bottom:5px; text-transform:uppercase; font-weight:700; }
.upload-area input { font-size:12px; background:#0B0E11; border:1px solid var(--border-dim); color:#FFF; width:100%; padding:9px; border-radius:8px; outline:none; }
.upload-area input:focus { border-color:var(--accent-mint); }

.btn-delete-all { width:100%; padding:11px; background:rgba(255,71,87,0.1); color:var(--danger); border:1px solid var(--danger); border-radius:10px; font-weight:800; font-size:11px; cursor:pointer; margin-top:15px; transition:0.3s; }
.btn-delete-all:hover { background:var(--danger); color:white; }

.empty-state { text-align:center; padding:50px 20px; color:var(--text-muted); }
.empty-state i { font-size:40px; margin-bottom:15px; color:var(--border-dim); }

/* ===== PRODUCTS LIST ===== */
.prod-card { background:var(--card-bg); padding:14px; border-radius:14px; margin-bottom:10px; display:flex; align-items:center; gap:14px; border:1px solid var(--border-dim); transition:0.3s; }
.prod-card:hover { border-color: var(--accent-mint); }
.prod-img { width:48px; height:48px; border-radius:10px; object-fit:cover; flex-shrink:0; background:#1a1a1a; }
.prod-info { flex:1; min-width:0; }
.prod-info h4 { font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.prod-info p { font-size:11px; color:var(--text-muted); margin-top:2px; }
.prod-price { font-size:11px; font-weight:800; color:var(--accent-mint); }
.prod-actions { display:flex; gap:10px; align-items:center; flex-shrink:0; }
.prod-actions i { cursor:pointer; font-size:16px; transition:0.2s; }
.icon-edit { color:var(--accent-mint); }
.icon-delete { color:var(--danger); }
.prod-actions i:hover { transform: scale(1.15); }

/* ===== FORM (Upload) ===== */
.form-card { background:var(--card-bg); padding:22px; border-radius:20px; border:1px solid var(--border-dim); display:flex; flex-direction:column; gap:14px; }
.input-group { display:flex; flex-direction:column; gap:7px; }
.input-group label { font-size:10px; color:var(--text-muted); font-weight:800; letter-spacing:1px; text-transform:uppercase; }
input, textarea, select {
    background:#0a0a0a; border:1px solid var(--border-dim); color:#fff;
    padding:12px; border-radius:12px; outline:none; width:100%; font-size:13px;
    font-family:inherit;
}
input:focus, textarea:focus, select:focus { border-color:var(--accent-mint); }
textarea { resize:vertical; min-height:80px; }
input[type="file"] { font-size:12px; padding:10px; }
input[type="number"]::-webkit-inner-spin-button { opacity:1; }

.preview-img { width:90px; height:90px; border-radius:14px; object-fit:cover; display:none; margin:6px auto 0; border:2px solid var(--accent-mint); }
.file-info { font-size:11px; color:var(--accent-mint); margin-top:4px; display:none; }

.btn-upload, .btn-save {
    background: var(--accent-gradient); color:#000; border:none; padding:15px;
    border-radius:14px; font-weight:800; cursor:pointer; margin-top:6px; transition:0.3s;
    box-shadow: var(--shadow-glow); font-size:13px; text-transform:uppercase; letter-spacing:0.5px;
}
.btn-upload:disabled, .btn-save:disabled { background:#333; color:#888; box-shadow:none; cursor:not-allowed; }
#statusMsg { font-size:13px; text-align:center; margin-top:8px; line-height:1.5; }

/* ===== CIRCULAR PROGRESS ===== */
.progress-wrapper {
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin-top:6px;
    padding:10px 0;
}
.progress-wrapper.active { display:flex; }
.progress-circle {
    position:relative;
    width:110px; height:110px;
}
.progress-circle svg { transform:rotate(-90deg); width:100%; height:100%; }
.progress-circle circle {
    fill:none;
    stroke-width:8;
}
.progress-circle .bg-ring { stroke:#1a1a1a; }
.progress-circle .fg-ring {
    stroke: var(--accent-mint);
    stroke-linecap:round;
    transition: stroke-dashoffset 0.25s ease;
    filter: drop-shadow(0 0 6px rgba(0,243,188,0.5));
}
.progress-circle .progress-label {
    position:absolute; top:0; left:0; width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    font-size:20px; font-weight:800; color:var(--accent-mint);
}
.progress-step-text {
    font-size:12px; color:var(--text-muted); font-weight:700; text-align:center;
}

/* ===== MODAL ===== */
.modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index:5000; justify-content:center; align-items:center; padding:20px; }
.modal.active { display:flex; }
.modal-content { background:var(--card-bg); width:100%; max-width:420px; padding:25px; border-radius:22px; border:1px solid var(--border-dim); max-height:85vh; overflow-y:auto; animation: slideUp 0.3s cubic-bezier(0.175,0.885,0.32,1.275); }
@keyframes slideUp { from{ transform:translateY(40px); opacity:0;} to{transform:translateY(0); opacity:1;} }
.modal-content h3 { margin-bottom:18px; font-size:18px; display:flex; align-items:center; gap:8px; }
.modal-actions { display:flex; gap:10px; margin-top:20px; }
.btn-cancel { flex:1; background:#222; color:white; border:none; padding:13px; border-radius:12px; cursor:pointer; font-weight:700; }
.btn-save { flex:2; margin-top:0; }
.row-2 { display:flex; gap:10px; }
.row-2 > .input-group { flex:1; }

.inject-btn { background:var(--accent-mint); border:none; color:#000; padding:0 15px; border-radius:12px; cursor:pointer; font-weight:700; }

@keyframes spin { from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
.spinner { animation: spin 1s linear infinite; }

/* badge for stat */
.stats-grid { display:grid; grid-template-columns: repeat(3,1fr); gap:10px; margin-bottom:20px; }
.stat-card { background:var(--card-bg); border:1px solid var(--border-dim); border-radius:14px; padding:14px; text-align:center; }
.stat-card .num { font-size:20px; font-weight:800; color:var(--accent-mint); }
.stat-card .lbl { font-size:10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; margin-top:4px; }

::placeholder { color:#555; }
</style>
</head>
<body>

<nav class="navbar">
    <div class="brand">
        <div class="brand-icon">X</div>
        Xgus<span>XG</span> <span style="color:#666; font-weight:600; font-size:13px; margin-left:8px;">Admin</span>
    </div>
    <div class="nav-right">
        <i class="fa-solid fa-circle-user"></i>
    </div>
</nav>

<div class="tab-wrapper">
    <div class="nav-tabs">
        <button class="tab-btn active" data-tab="orders"><i class="fa-solid fa-cart-shopping"></i> Pesanan</button>
        <button class="tab-btn" data-tab="products"><i class="fa-solid fa-layer-group"></i> Produk</button>
        <button class="tab-btn" data-tab="upload"><i class="fa-solid fa-cloud-arrow-up"></i> Upload</button>
    </div>
</div>

<div class="container">

    <!-- ================= TAB: ORDERS ================= -->
    <div id="orders-tab" class="tab-content active">
        <div class="section-title">Antrian Pesanan</div>
        <div class="stats-grid">
            <div class="stat-card"><div class="num" id="statTotal">0</div><div class="lbl">Total</div></div>
            <div class="stat-card"><div class="num" id="statPending">0</div><div class="lbl">Pending</div></div>
            <div class="stat-card"><div class="num" id="statDone">0</div><div class="lbl">Selesai</div></div>
        </div>
        <div id="groupedOrderContainer"><div class="empty-state"><i class="fa-solid fa-spinner spinner"></i><br>Menghubungkan ke database...</div></div>
    </div>

    <!-- ================= TAB: PRODUCTS ================= -->
    <div id="products-tab" class="tab-content">
        <div class="section-title">Kelola Produk</div>
        <div id="productContainer"><div class="empty-state"><i class="fa-solid fa-spinner spinner"></i><br>Memuat katalog...</div></div>
    </div>

    <!-- ================= TAB: UPLOAD ================= -->
    <div id="upload-tab" class="tab-content">
        <div class="section-title">Upload Produk Baru</div>
        <div class="form-card">
            <div class="input-group">
                <label>Upload Avatar (JPG/PNG)</label>
                <input type="file" id="fileInput" accept="image/*">
                <img id="imgPreview" class="preview-img">
            </div>

            <div class="input-group">
                <label>Upload Preview Audio (MP3/WAV)</label>
                <input type="file" id="audioInput" accept="audio/*">
                <p id="audioFileName" class="file-info"></p>
            </div>

            <div class="input-group">
                <label>Judul Project</label>
                <input type="text" id="prodTitle" placeholder="Misal: Jedag Jedug Slow">
            </div>

            <div class="row-2">
                <div class="input-group">
                    <label>Nama Artis</label>
                    <input type="text" id="prodArtist" placeholder="Nama Artist">
                </div>
                <div class="input-group">
                    <label>Genre</label>
                    <input type="text" id="prodGenre" placeholder="Funky House, dll">
                </div>
            </div>

            <div class="row-2">
                <div class="input-group">
                    <label>Harga (RP)</label>
                    <input type="number" id="prodPrice" placeholder="0 = Free">
                </div>
                <div class="input-group">
                    <label>Diskon (RP)</label>
                    <input type="number" id="prodDiskon" placeholder="0">
                </div>
            </div>

            <div class="input-group">
                <label>Deskripsi Produk</label>
                <textarea id="prodDesc" placeholder="Jelaskan detail project ini..."></textarea>
            </div>

            <button id="btnSubmit" class="btn-upload"><i class="fa-solid fa-floppy-disk"></i> SIMPAN KE DATABASE</button>

            <div class="progress-wrapper" id="progressWrapper">
                <div class="progress-circle">
                    <svg viewBox="0 0 120 120">
                        <circle class="bg-ring" cx="60" cy="60" r="52"></circle>
                        <circle class="fg-ring" id="progressRing" cx="60" cy="60" r="52"
                            stroke-dasharray="326.7" stroke-dashoffset="326.7"></circle>
                    </svg>
                    <div class="progress-label" id="progressLabel">0%</div>
                </div>
                <div class="progress-step-text" id="progressStepText">Mempersiapkan...</div>
            </div>

            <p id="statusMsg"></p>
        </div>
    </div>

</div>

<!-- ================= MODAL EDIT PRODUK ================= -->
<div class="modal" id="editModal">
    <div class="modal-content">
        <h3><i class="fa-solid fa-pen" style="color:var(--accent-mint);"></i> Edit Produk</h3>
        <input type="hidden" id="edit-id">

        <div class="row-2">
            <div class="input-group">
                <label>Urutan (Priority)</label>
                <input type="number" id="edit-priority" placeholder="1 = paling atas">
            </div>
            <div class="input-group">
                <label>Harga (IDR)</label>
                <input type="number" id="edit-harga">
            </div>
        </div>

        <div class="input-group" style="margin-top:14px;">
            <label>Judul Project</label>
            <input type="text" id="edit-judul">
        </div>

        <div class="input-group" style="margin-top:14px;">
            <label>Link Produk (Slug)</label>
            <div style="display:flex; gap:8px;">
                <input type="text" id="edit-linkProduk" placeholder="Klik tombol suntik..." style="flex:1;">
                <button id="btn-single-inject" class="inject-btn" title="Suntik dari Judul"><i class="fa-solid fa-syringe"></i></button>
            </div>
        </div>

        <div class="row-2" style="margin-top:14px;">
            <div class="input-group">
                <label>Nama Artis</label>
                <input type="text" id="edit-artis">
            </div>
            <div class="input-group">
                <label>Genre</label>
                <input type="text" id="edit-genre">
            </div>
        </div>

        <div class="input-group" style="margin-top:14px;">
            <label>Diskon (IDR)</label>
            <input type="number" id="edit-diskon">
        </div>

        <div class="input-group" style="margin-top:14px;">
            <label>Deskripsi</label>
            <textarea id="edit-deskripsi"></textarea>
        </div>

        <div class="input-group" style="margin-top:14px;">
            <label>Link File Project (Google Drive/Mega)</label>
            <input type="text" id="edit-downloadlink" placeholder="Tempel link file di sini...">
        </div>

        <div class="input-group" style="margin-top:14px;">
            <label>Ganti Avatar (Image)</label>
            <input type="file" id="replace-avatar" accept="image/*">
        </div>

        <div class="input-group" style="margin-top:10px;">
            <label>Ganti Audio Preview (.mp3)</label>
            <input type="file" id="replace-audio" accept="audio/*">
        </div>

        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeEditModal()">Batal</button>
            <button class="btn-save" id="saveProductBtn">Simpan Perubahan</button>
        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAaPyl0-gKKhxKjhyCmqduUF11N6C1ngZ4",
    authDomain: "omwnfx1.firebaseapp.com",
    projectId: "omwnfx1",
    databaseURL: "https://omwnfx1-default-rtdb.asia-southeast1.firebasedatabase.app",
    storageBucket: "omwnfx1.firebasestorage.app",
    messagingSenderId: "1063248927187",
    appId: "1:1063248927187:web:6bd23f24517b1c2d53b726"
};

const CLOUDINARY_URL = "https://api.cloudinary.com/v1_1/ddjn8t2zs/auto/upload";
const CLOUDINARY_UPLOAD_PRESET = "omwnfx";

const app = initializeApp(firebaseConfig);
const rtdb = getDatabase(app);
const fs = getFirestore(app);

/* ============ TAB SWITCH ============ */
document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(btn.dataset.tab + '-tab').classList.add('active');
        btn.classList.add('active');
    });
});

/* ============ ORDERS (Pesanan) ============ */
// index.html menyimpan ke path "pesanan/<guestUID>/<orderId>"
// dashboard lama membaca path "orders/<orderId>"
// Gabungkan keduanya supaya semua pesanan tampil

let ordersFromPesanan = {};
let ordersFromOrders = {};

function renderOrders() {
    const allOrders = [];

    // dari pesanan/<uid>/<orderId>
    Object.keys(ordersFromPesanan).forEach(uid => {
        const userOrders = ordersFromPesanan[uid] || {};
        Object.keys(userOrders).forEach(oid => {
            const o = userOrders[oid];
            allOrders.push({
                id: oid,
                pathPrefix: `pesanan/${uid}/${oid}`,
                userId: uid,
                customerName: o.userEmail || uid,
                userPhoto: '',
                judul: o.productTitle || o.judul || 'Project',
                kategori: o.kategori || 'project',
                status: (o.status || 'Pending').toLowerCase(),
                harga: o.price || '',
                downloadlink: o.downloadlink || '',
                timestamp: o.timestamp || 0
            });
        });
    });

    // dari orders/<orderId>
    Object.keys(ordersFromOrders).forEach(oid => {
        const o = ordersFromOrders[oid];
        allOrders.push({
            id: oid,
            pathPrefix: `orders/${oid}`,
            userId: o.userId || 'Guest',
            customerName: o.customerName || o.userId || 'Guest',
            userPhoto: o.userPhoto || '',
            judul: o.judul || o.judulProject || 'Project',
            kategori: o.kategori || 'project',
            status: (o.status || 'pending').toLowerCase(),
            harga: o.harga || '',
            downloadlink: o.downloadlink || '',
            timestamp: o.timestamp || 0
        });
    });

    const container = document.getElementById('groupedOrderContainer');

    // stats
    document.getElementById('statTotal').innerText = allOrders.length;
    document.getElementById('statPending').innerText = allOrders.filter(o => o.status !== 'success' && o.status !== 'selesai').length;
    document.getElementById('statDone').innerText = allOrders.filter(o => o.status === 'success' || o.status === 'selesai').length;

    if (allOrders.length === 0) {
        container.innerHTML = `<div class="empty-state"><i class="fa-solid fa-inbox"></i><br>Belum ada pesanan.</div>`;
        return;
    }

    const groups = allOrders.reduce((acc, obj) => {
        const key = obj.userId || 'Guest';
        if (!acc[key]) acc[key] = { name: obj.customerName || 'User', userPhoto: obj.userPhoto || '', items: [] };
        acc[key].items.push(obj);
        return acc;
    }, {});

    container.innerHTML = "";
    Object.keys(groups).forEach(uid => {
        const g = groups[uid];
        const gDiv = document.createElement('div');
        gDiv.className = 'user-group';

        `;

        gDiv.querySelector(`#head-${CSS.escape(uid)}`)?.addEventListener('click', () => {

        gDiv.querySelectorAll('.btn-confirm').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();

// Listen "pesanan" (per-user, sesuai index.html)
onValue(ref(rtdb, 'pesanan'), (snap) => {
    ordersFromPesanan = snap.val() || {};
    renderOrders();
});

// Listen "orders" (path legacy)
onValue(ref(rtdb, 'orders'), (snap) => {
    ordersFromOrders = snap.val() || {};
    renderOrders();
});

async function handleConfirm(btn) {
    const path = btn.dataset.path;
    const isCloudinary = btn.dataset.cloud === 'true';
    let downloadURL = "";

    if (isCloudinary) {
        const safeId = path.split('/').pop().replace(/[^a-zA-Z0-9]/g, '_');
        const linkInput = document.getElementById(`link-${safeId}`);
        if (!linkInput || !linkInput.value.trim()) {
            alert("Masukkan link Google Drive dulu, Om!");
            return;
        }
        if (!confirm("Konfirmasi pengerjaan dengan link ini?")) return;
        downloadURL = linkInput.value.trim();
    } else {
        if (!confirm("Tandai pesanan ini sebagai selesai?")) return;
    }

    try {
        const updates = { status: 'success', doneAt: Date.now() };
        if (downloadURL) updates.downloadlink = downloadURL;
        await update(ref(rtdb, path), updates);
        alert("Pesanan Berhasil Diselesaikan!");
    } catch (e) {
        console.error(e);
        alert("Gagal update database: " + e.message);
    }
}

async function handleDeleteOrder(path) {
    if (!confirm("Hapus pesanan ini secara permanen dari database?")) return;
    try {
        await remove(ref(rtdb, path));
        alert("Pesanan dihapus.");
    } catch (e) {
        alert("Gagal menghapus pesanan: " + e.message);
    }
}

async function handleDeleteAllGroup(uid) {
    if (!confirm("Yakin hapus SEMUA pesanan di grup ini? Data di Firebase akan hilang total!")) return;
    try {
        // hapus dari pesanan/<uid>
        if (ordersFromPesanan[uid]) {
            await remove(ref(rtdb, `pesanan/${uid}`));
        }
        // hapus dari orders/ yang userId == uid
        const keys = Object.keys(ordersFromOrders).filter(k => ordersFromOrders[k].userId === uid);
        for (const key of keys) {
            await remove(ref(rtdb, `orders/${key}`));
        }
        alert("Seluruh isi grup berhasil dihapus!");
    } catch (e) {
        alert("Gagal menghapus grup: " + e.message);
    }
}

/* ============ PRODUCTS LIST (Firestore) ============ */
onSnapshot(collection(fs, "products"), (snap) => {
    const container = document.getElementById('productContainer');
    if (snap.empty) {
        container.innerHTML = `<div class="empty-state"><i class="fa-solid fa-box-open"></i><br>Belum ada produk.</div>`;
        return;
    }
    container.innerHTML = "";
    const docsArr = [];
    snap.forEach(docSnap => docsArr.push({ id: docSnap.id, ...docSnap.data() }));
    docsArr.sort((a,b) => (a.priority||0) - (b.priority||0));

    docsArr.forEach(p => {
        const id = p.id;
        const harga = Number(p.harga) || 0;
        const div = document.createElement('div');
        div.className = 'prod-card';
        div.innerHTML = `
            <img src="${p.avatar || ''}" class="prod-img">
            <div class="prod-info">
                <h4>${p.judul || 'Tanpa Judul'}</h4>
                <p>${p.artis || '-'} • ${p.genre || '-'}</p>
                <div style="display:flex; gap:8px; align-items:center; margin-top:4px;">
                    <span class="prod-price">${harga === 0 ? 'FREE' : 'Rp ' + harga.toLocaleString('id-ID')}</span>
                    ${p.diskon ? `<span style="font-size:10px; color:#666; text-decoration:line-through;">Rp ${Number(p.diskon).toLocaleString('id-ID')}</span>` : ''}
                    <span style="font-size:10px; color:var(--blue);">P:${p.priority || 0}</span>

async function uploadToCloudinary(file, onProgress) {
    return new Promise((resolve, reject) => {
        const formData = new FormData();
        formData.append("file", file);
        formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

        const xhr = new XMLHttpRequest();
        xhr.open("POST", CLOUDINARY_URL);

        xhr.upload.onprogress = (e) => {
            if (e.lengthComputable && onProgress) {
                const percent = Math.round((e.loaded / e.total) * 100);
                onProgress(percent);
            }
        };

        xhr.onload = () => {
            if (xhr.status >= 200 && xhr.status < 300) {
                try {
                    const resData = JSON.parse(xhr.responseText);
                    resolve(resData.secure_url);
                } catch (err) {
                    reject(new Error("Gagal membaca respon Cloudinary"));
                }
            } else {
                reject(new Error("Gagal upload ke Cloudinary"));
            }
        };

        xhr.onerror = () => reject(new Error("Gagal upload ke Cloudinary"));
        xhr.send(formData);
    });
}

document.getElementById('saveProductBtn').addEventListener('click', async () => {

    const id = document.getElementById('edit-id').value;

            diskon: Number(document.getElementById('edit-diskon').value),
            deskripsi: document.getElementById('edit-deskripsi').value,
            downloadlink: document.getElementById('edit-downloadlink').value
        };

        const fileAvatar = document.getElementById('replace-avatar').files[0];
        const fileAudio = document.getElementById('replace-audio').files[0];

        if (fileAvatar) upData.avatar = await uploadToCloudinary(fileAvatar);
        if (fileAudio) upData.audio = await uploadToCloudinary(fileAudio);

        await updateDoc(doc(fs, "products", id), upData);
        alert("Produk berhasil diupdate!");
        closeEditModal();
    } catch (e) {
        console.error(e);
        alert("Gagal update produk: " + e.message);
    } finally {
        btn.disabled = false;
        btn.innerHTML = original;
    }
});

/* ============ UPLOAD NEW PRODUCT ============ */
const fileInput = document.getElementById('fileInput');
const audioInput = document.getElementById('audioInput');
const audioFileName = document.getElementById('audioFileName');
const btnSubmit = document.getElementById('btnSubmit');
const status = document.getElementById('statusMsg');
const preview = document.getElementById('imgPreview');

const progressWrapper = document.getElementById('progressWrapper');
const progressRing = document.getElementById('progressRing');
const progressLabel = document.getElementById('progressLabel');
const progressStepText = document.getElementById('progressStepText');

const RING_CIRCUMFERENCE = 2 * Math.PI * 52; // r=52

function setProgress(percent, stepText) {
    const clamped = Math.max(0, Math.min(100, percent));
    const offset = RING_CIRCUMFERENCE - (clamped / 100) * RING_CIRCUMFERENCE;
    progressRing.style.strokeDashoffset = offset;
    progressLabel.innerText = clamped + "%";
    if (stepText) progressStepText.innerText = stepText;
}

function showProgress() {
    progressWrapper.classList.add('active');
    setProgress(0, "Mempersiapkan...");
}

function hideProgress() {
    progressWrapper.classList.remove('active');
}

fileInput.onchange = () => {
    const file = fileInput.files[0];
    if (file) {
        preview.src = URL.createObjectURL(file);
        preview.style.display = "block";
    }
};

audioInput.onchange = () => {
    const file = audioInput.files[0];
    if (file) {
        audioFileName.innerText = "🎵 Audio: " + file.name;
        audioFileName.style.display = "block";
    }
};

btnSubmit.onclick = async () => {
    const imgFile = fileInput.files[0];
    const audioFile = audioInput.files[0];
    const title = document.getElementById('prodTitle').value;
    const artist = document.getElementById('prodArtist').value;
    const genre = document.getElementById('prodGenre').value;
    const price = document.getElementById('prodPrice').value;
    const diskon = document.getElementById('prodDiskon').value;
    const desc = document.getElementById('prodDesc').value;

    if (!imgFile || !audioFile || !title || !artist || !genre || price === "" || !desc) {
        alert("Semua file (Avatar, Audio), dan semua kolom harus diisi ya Om!");
        return;
    }

    btnSubmit.disabled = true;
    status.style.color = "#FFFFFF";
    status.innerText = "";
    showProgress();

    try {
        // Upload gambar: porsi 0% - 50%
        setProgress(0, "🚀 Mengupload Gambar...");
        const imageUrl = await uploadToCloudinary(imgFile, (p) => {
            setProgress(Math.round(p * 0.5), "🚀 Mengupload Gambar...");
        });

        // Upload audio: porsi 50% - 95%
        setProgress(50, "🎵 Mengupload Audio...");
        const audioUrl = await uploadToCloudinary(audioFile, (p) => {
            setProgress(50 + Math.round(p * 0.45), "🎵 Mengupload Audio...");
        });

        // Simpan ke database: porsi 95% - 100%
        setProgress(95, "💾 Menyimpan ke Database...");
        const judul = title;
        const slug = judul.toLowerCase().replace(/[^\w ]+/g, '').replace(/ +/g, '-');

        await addDoc(collection(fs, "products"), {
            avatar: imageUrl,
            audio: audioUrl,
            judul: judul,
            artis: artist,
            genre: genre,
            harga: Number(price),
            diskon: Number(diskon) || 0,
            deskripsi: desc,
            linkProduk: slug,
            priority: 0,
            checkout: 0,
            createdAt: serverTimestamp()
        });

        setProgress(100, "Selesai!");

        status.innerText = "✅ BERHASIL! Produk & Audio sudah online.";
        status.style.color = "var(--accent-mint)";

        document.querySelectorAll('#upload-tab input, #upload-tab textarea').forEach(i => i.value = "");
        preview.style.display = "none";
        audioFileName.style.display = "none";

        setTimeout(hideProgress, 1200);

    } catch (err) {
        console.error(err);
        status.innerText = "❌ Gagal: " + err.message;
        status.style.color = "#ff4444";
        hideProgress();
    } finally {
        btnSubmit.disabled = false;
    }
};
</script>
