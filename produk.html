<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wnfx Library | Premium FLM Resources</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-black: #050505;
            --card-bg: #111111;
            --accent-mint: #00f3bc;
            --text-muted: #888;
            --border-dim: #222;
            --accent-gradient: linear-gradient(135deg, #e0ff99 0%, #00f3bc 100%);
            --shadow-glow: 0 8px 25px rgba(0, 243, 188, 0.25);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-black);
            color: #fff;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 150px; /* Ditambah agar tidak tertutup player */
            overflow-x: hidden;
        }

        /* --- NAVBAR --- */
        .navbar {
            width: 100%; max-width: 480px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px; background: rgba(5, 5, 5, 0.85); backdrop-filter: blur(15px);
            position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .brand { display: flex; align-items: center; font-size: 20px; font-weight: 800; color: #fff; text-transform: uppercase; }
        .brand span { color: var(--accent-mint); margin-left: 2px; }

        /* --- HEADER --- */
        .library-header {
            width: 100%; max-width: 450px;
            padding: 40px 20px 20px; text-align: left;
        }
        .library-header h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
        .library-header p { color: var(--text-muted); font-size: 14px; }

        /* --- SEARCH & FILTER --- */
        .search-container { width: 100%; max-width: 440px; padding: 0 20px; margin-bottom: 25px; }
        .search-bar {
            width: 100%; background: #1a1a1a; border-radius: 12px;
            padding: 12px 18px; display: flex; align-items: center; gap: 12px;
            border: 1px solid var(--border-dim);
        }
        .search-bar input { background: transparent; border: none; color: #fff; outline: none; width: 100%; font-size: 14px; }

        /* --- FILTER CHIPS --- */
        .filter-scroll {
            width: 100%; display: flex; overflow-x: auto; gap: 10px;
            padding: 0 20px 20px; scrollbar-width: none;
        }
        .filter-scroll::-webkit-scrollbar { display: none; }
        .chip {
            padding: 8px 18px; background: #111; border: 1px solid #222;
            border-radius: 20px; font-size: 12px; font-weight: 600;
            white-space: nowrap; cursor: pointer; transition: 0.3s;
        }
        .chip.active { background: var(--accent-mint); color: #000; border-color: var(--accent-mint); }

        /* --- PRODUCT GRID --- */
        .product-grid {
            display: grid; grid-template-columns: repeat(2, 1fr);
            gap: 15px; width: 100%; max-width: 440px; padding: 0 20px;
        }

        .lib-card {
            background: var(--card-bg); border: 1px solid var(--border-dim);
            border-radius: 16px; overflow: hidden; transition: 0.3s;
        }
        .lib-thumb { width: 100%; aspect-ratio: 1/1; position: relative; overflow: hidden; }
        .lib-thumb img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .lib-card:hover .lib-thumb img { transform: scale(1.1); }
        
        /* TOMBOL PLAY DI ATAS THUMBNAIL */
        .play-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.3); display: flex; align-items: center;
            justify-content: center; opacity: 0; transition: 0.3s; cursor: pointer;
        }
        .lib-card:hover .play-overlay { opacity: 1; }
        .play-btn-circle {
            width: 45px; height: 45px; background: var(--accent-mint);
            border-radius: 50%; display: flex; align-items: center;
            justify-content: center; color: #000; font-size: 18px;
            box-shadow: 0 0 20px rgba(0, 243, 188, 0.4);
        }

        .lib-badge {
            position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.7);
            padding: 3px 8px; border-radius: 6px; font-size: 9px; font-weight: 700; color: var(--accent-mint); z-index: 2;
        }
        .lib-info { padding: 12px; }
        .lib-info h4 { font-size: 13px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .lib-info p { font-size: 10px; color: var(--text-muted); margin-bottom: 10px; }
        .lib-footer { display: flex; justify-content: space-between; align-items: center; }
        .lib-price { font-size: 12px; font-weight: 700; }
        .btn-get {
            background: var(--accent-gradient); border: none; padding: 6px 12px;
            border-radius: 8px; font-size: 10px; font-weight: 800; cursor: pointer;
        }

        /* --- FLOATING PLAYER (Sama dengan Index) --- */
        .floating-player {
            position: fixed; bottom: 85px; left: 50%; transform: translateX(-50%);
            width: calc(100% - 30px); max-width: 470px;
            background: rgba(15, 15, 15, 0.9); backdrop-filter: blur(20px);
            padding: 12px 15px; border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px; z-index: 9000; display: none; opacity: 0;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .floating-player.active { display: block; opacity: 1; }
        .player-inner { display: flex; align-items: center; gap: 10px; }
        .album-art-mini { width: 40px; height: 40px; border-radius: 10px; overflow: hidden; flex-shrink: 0; }
        .album-art-mini img { width: 100%; height: 100%; object-fit: cover; }
        .track-meta-mini { flex: 1; overflow: hidden; }
        .btn-play-mini { width: 38px; height: 38px; background: #fff; border-radius: 50%; border: none; color: #000; cursor: pointer; }
        .seek-bar { flex: 2; height: 4px; background: #222; border-radius: 2px; position: relative; cursor: pointer; }
        .seek-fill { width: 0%; height: 100%; background: var(--accent-mint); border-radius: 2px; }

        /* --- BOTTOM NAV --- */
        .bottom-nav {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 480px; background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(20px); display: flex; justify-content: space-around;
            padding: 12px 0 25px; border-top: 1px solid rgba(255,255,255,0.1); z-index: 9999;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #666; text-decoration: none; font-size: 10px; }
        .nav-item.active { color: var(--accent-mint); }
        .nav-item i { font-size: 20px; }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); display: none; justify-content: center; align-items: center; z-index: 10001; padding: 20px; }
        .checkout-card { width: 100%; max-width: 400px; background: var(--card-bg); border: 1px solid var(--border-dim); border-radius: 24px; padding: 25px; animation: slideUp 0.3s ease; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="brand">Wnfx<span>Library</span></div>
        <div class="nav-right" style="display:flex; gap:15px; font-size:18px;">
            <i class="fa-solid fa-cart-shopping" onclick="location.href='index.html?open=cart'"></i>
        </div>
    </nav>

    <header class="library-header">
        <h1>All Projects</h1>
        <p>Explore our full catalog of premium FLM files.</p>
    </header>

    <div class="search-container">
        <div class="search-bar">
            <i class="fa-solid fa-magnifying-glass" style="color:#555"></i>
            <input type="text" id="libSearch" placeholder="Search project name..." oninput="filterProducts()">
        </div>
    </div>

    <div class="filter-scroll">
        <div class="chip active" onclick="setCategory('All', this)">All</div>
        <div class="chip" onclick="setCategory('Phonk', this)">Phonk</div>
        <div class="chip" onclick="setCategory('Remix', this)">Remix</div>
        <div class="chip" onclick="setCategory('Hipdut', this)">Hipdut</div>
        <div class="chip" onclick="setCategory('Presets', this)">Presets</div>
        <div class="chip" onclick="setCategory('Stems', this)">Stems</div>
    </div>

    <div class="product-grid" id="productGrid">
        <p style="grid-column: span 2; text-align: center; color: #444; padding: 40px;">Loading catalog...</p>
    </div>

    <footer class="floating-player" id="mainPlayer">
        <div class="player-inner">
            <div class="album-art-mini" id="playerArt"><i class="fa-solid fa-compact-disc"></i></div>
            <div class="track-meta-mini">
                <div id="current-track" style="font-size: 11px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Select track...</div>
                <div id="player-time" style="font-size: 9px; color: #666;">0:00 / 0:30</div>
            </div>
            <button class="btn-play-mini" id="mainPlayBtn"><i class="fa-solid fa-play"></i></button>
            <div class="seek-bar" id="seekBar">
                <div class="seek-fill" id="seekFill"></div>
            </div>
        </div>
    </footer>

    <div class="overlay" id="checkoutOverlay">
        <div class="checkout-card">
            <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
                <h2 style="font-size:18px;">Product Detail</h2>
                <i class="fa-solid fa-xmark" onclick="closeCheckout()" style="cursor:pointer"></i>
            </div>
            <img src="" id="coImg" style="width:100%; border-radius:15px; margin-bottom:15px; aspect-ratio:1/1; object-fit:cover;">
            <h3 id="coTitle">Track Name</h3>
            <p id="coGenre" style="font-size:12px; color:#888; margin-bottom:20px;">Genre • FLM Project</p>
            <button class="btn-get" id="btnConfirm" style="width:100%; padding:15px; border-radius:30px; font-size:14px;">GET NOW</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fa-solid fa-house-chimney"></i><span>Home</span></a>
        <a href="library.html" class="nav-item active"><i class="fa-solid fa-layer-group"></i><span>Library</span></a>
        <a href="javascript:void(0)" class="nav-item" onclick="alert('Buka Keranjang di Halaman Utama')"><i class="fa-solid fa-cart-shopping"></i><span>Orders</span></a>
        <a href="profile.html" class="nav-item"><i class="fa-solid fa-circle-user"></i><span>Account</span></a>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAaPyl0-gKKhxKjhyCmqduUF11N6C1ngZ4",
            authDomain: "omwnfx1.firebaseapp.com",
            projectId: "omwnfx1",
            storageBucket: "omwnfx1.firebasestorage.app",
            messagingSenderId: "1063248927187",
            appId: "1:1063248927187:web:6bd23f24517b1c2d53b726"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allProducts = [];
        let currentCategory = 'All';
        let audioPlayer = new Audio();
        let isPlaying = false;

        async function fetchLibrary() {
            const querySnapshot = await getDocs(collection(db, "products"));
            allProducts = [];
            querySnapshot.forEach((doc) => {
                allProducts.push({ id: doc.id, ...doc.data() });
            });
            renderProducts(allProducts);
        }

        function renderProducts(data) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            data.forEach(prod => {
                const price = parseInt(prod.harga) || 0;
                const displayPrice = price === 0 ? "FREE" : "IDR " + price.toLocaleString('id-ID');
                
                grid.innerHTML += `
                    <div class="lib-card">
                        <div class="lib-thumb">
                            <div class="lib-badge">${prod.genre || 'HOT'}</div>
                            <img src="${prod.avatar || 'https://via.placeholder.com/300'}" alt="${prod.judul}">
                            <div class="play-overlay" onclick="playPreview('${prod.audio}', '${prod.judul}', '${prod.avatar}', this)">
                                <div class="play-btn-circle"><i class="fa-solid fa-play"></i></div>
                            </div>
                        </div>
                        <div class="lib-info">
                            <h4>${prod.judul}</h4>
                            <p>FL Studio Mobile</p>
                            <div class="lib-footer">
                                <span class="lib-price" style="${price === 0 ? 'color:var(--accent-mint)' : ''}">${displayPrice}</span>
                                <button class="btn-get" onclick="openDetail('${prod.id}', '${prod.judul}', '${prod.avatar}', '${displayPrice}', '${prod.genre}', '${prod.downloadlink}')">GET</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        window.playPreview = function(audioSrc, title, img, el) {
            const player = document.getElementById('mainPlayer');
            const icon = el.querySelector('i');

            if (audioPlayer.src === audioSrc && !audioPlayer.paused) {
                audioPlayer.pause();
                isPlaying = false;
            } else {
                if (audioPlayer.src !== audioSrc) {
                    audioPlayer.src = audioSrc;
                    document.getElementById('current-track').innerText = title;
                    document.getElementById('playerArt').innerHTML = `<img src="${img}">`;
                }
                audioPlayer.play();
                isPlaying = true;
                player.classList.add('active');
            }
            updateUI(icon);
        }

        function updateUI(activeIcon) {
            document.querySelectorAll('.play-btn-circle i').forEach(i => i.className = 'fa-solid fa-play');
            const mainPlayBtn = document.getElementById('mainPlayBtn');
            
            if (isPlaying) {
                if (activeIcon) activeIcon.className = 'fa-solid fa-pause';
                mainPlayBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
            } else {
                mainPlayBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
            }
        }

        // Seek Bar Logic
        audioPlayer.ontimeupdate = () => {
            const pct = (audioPlayer.currentTime / audioPlayer.duration) * 100;
            document.getElementById('seekFill').style.width = pct + '%';
            document.getElementById('player-time').innerText = formatTime(audioPlayer.currentTime) + " / 0:30";
        };

        function formatTime(s) {
            const m = Math.floor(s/60); const sc = Math.floor(s%60);
            return `${m}:${sc < 10 ? '0'+sc : sc}`;
        }

        document.getElementById('mainPlayBtn').onclick = () => {
            audioPlayer.paused ? audioPlayer.play() : audioPlayer.pause();
            isPlaying = !audioPlayer.paused;
            updateUI();
        };

        // Logic Filter & Search (Reuse from your prompt)
        window.filterProducts = function() {
            const keyword = document.getElementById('libSearch').value.toLowerCase();
            const filtered = allProducts.filter(p => {
                const matchName = p.judul.toLowerCase().includes(keyword);
                const matchCat = currentCategory === 'All' || p.genre === currentCategory;
                return matchName && matchCat;
            });
            renderProducts(filtered);
        }

        window.setCategory = function(cat, el) {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            currentCategory = cat;
            filterProducts();
        }

        window.openDetail = function(id, title, img, price, genre, link) {
            document.getElementById('coTitle').innerText = title;
            document.getElementById('coImg').src = img;
            document.getElementById('coGenre').innerText = genre + ' • FLM Project';
            document.getElementById('checkoutOverlay').style.display = 'flex';
            const btn = document.getElementById('btnConfirm');
            btn.innerText = price === "FREE" ? "DOWNLOAD NOW" : "BUY " + price;
            btn.onclick = async () => {
                if(price === "FREE") {
                    await updateDoc(doc(db, "products", id), { checkout: increment(1) });
                    window.open(link, '_blank');
                } else { alert("Contact admin for premium files."); }
            };
        }

        window.closeCheckout = () => document.getElementById('checkoutOverlay').style.display = 'none';
        fetchLibrary();
    </script>
</body>
</html>
