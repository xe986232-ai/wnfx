<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Pesanan - WNFX</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* BASE STYLE */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #14171C;
            color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(180deg, #1A1E26 0%, #14171C 300px);
        }

        /* HEADER */
        header {
            width: 100%;
            max-width: 500px;
            display: flex;
            align-items: center;
            padding: 25px 20px;
            position: sticky;
            top: 0;
            background-color: rgba(20, 23, 28, 0.9);
            backdrop-filter: blur(15px);
            z-index: 1000;
        }

        .home-btn {
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: opacity 0.3s;
        }

        .home-btn:hover {
            opacity: 0.7;
        }

        .page-title {
            font-weight: 800;
            font-size: 18px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            letter-spacing: 1px;
            white-space: nowrap;
        }

        /* CONTENT CONTAINER */
        main {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        .section-header {
            margin-bottom: 30px;
            text-align: center;
        }

        .section-header h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .section-header p {
            font-size: 14px;
            color: #636E7A;
            line-height: 1.5;
        }

        /* ORDER CARD */
        .order-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .order-card {
            background-color: #090A0C;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .order-card:hover {
            border-color: #23C55E;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .order-info h3 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 4px;
            color: #FFFFFF;
        }

        .order-date {
            font-size: 11px;
            color: #636E7A;
        }

        /* STATUS BADGE */
        .status-badge {
            font-size: 10px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 10px;
            text-transform: uppercase;
        }

        .status-pending {
            background: rgba(255, 193, 7, 0.1);
            color: #FFC107;
            border: 1px solid rgba(255, 193, 7, 0.2);
        }

        .status-completed {
            background: rgba(35, 197, 94, 0.1);
            color: #23C55E;
            border: 1px solid rgba(35, 197, 94, 0.2);
        }

        /* DOWNLOAD AREA */
        .download-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #14171C;
            padding: 12px 15px;
            border-radius: 15px;
            margin-top: 10px;
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
        }

        .file-info i { color: #23C55E; }

        .btn-download {
            background: #23C55E;
            color: white;
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
            padding: 8px 16px;
            border-radius: 20px;
            transition: 0.3s;
            box-shadow: 0 4px 12px rgba(35, 197, 94, 0.2);
        }

        .btn-download.disabled {
            background: #2A2F37;
            color: #636E7A;
            pointer-events: none;
            box-shadow: none;
        }

        /* EMPTY STATE */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-state i {
            font-size: 50px;
            color: #2A2F37;
            margin-bottom: 20px;
        }

        .empty-state p { color: #636E7A; font-size: 14px; }
    </style>
</head>
<body>

    <header>
        <div class="home-btn" onclick="location.href='index.html'">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: white;">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
        </div>
        <span class="page-title">WNFX</span>
    </header>

    <main>
        <div class="section-header">
            <h1>Riwayat Pesanan</h1>
            <p>Pantau dan unduh produk yang sudah kamu beli.</p>
        </div>

        <div class="order-list" id="orderContainer">
            <div class="empty-state" id="loader">
                <i class="fa-solid fa-circle-notch fa-spin"></i>
                <p>Memeriksa riwayat pesanan...</p>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, query, orderByChild, equalTo, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { getFirestore, collection, query as fsQuery, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAaPyl0-gKKhxKjhyCmqduUF11N6C1ngZ4",
            authDomain: "omwnfx1.firebaseapp.com",
            projectId: "omwnfx1",
            databaseURL: "https://omwnfx1-default-rtdb.asia-southeast1.firebasedatabase.app",
            storageBucket: "omwnfx1.firebasestorage.app",
            messagingSenderId: "1063248927187",
            appId: "1:1063248927187:web:6bd23f24517b1c2d53b726"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const rtdb = getDatabase(app);
        const db = getFirestore(app);

        const orderContainer = document.getElementById('orderContainer');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                const ordersRef = ref(rtdb, 'orders');
                const vocalOrdersRef = ref(rtdb, 'vocal_orders');

                const qOrders = query(ordersRef, orderByChild('userId'), equalTo(user.uid));
                const qVocal = query(vocalOrdersRef, orderByChild('userId'), equalTo(user.uid));

                const loadAllOrders = () => {
                    let allOrders = [];
                    let loadedCount = 0;

                    const processSnapshot = (snapshot) => {
                        if (snapshot.exists()) {
                            snapshot.forEach((child) => {
                                allOrders.push({ id: child.key, ...child.val() });
                            });
                        }
                        loadedCount++;
                        
                        if (loadedCount === 2) {
                            renderOrders(allOrders);
                        }
                    };

                    onValue(qOrders, processSnapshot);
                    onValue(qVocal, processSnapshot);
                };

                const renderOrders = async (orders) => {
                    orderContainer.innerHTML = '';
                    
                    if (orders.length === 0) {
                        orderContainer.innerHTML = `
                            <div class="empty-state">
                                <i class="fa-solid fa-box-open"></i>
                                <p>Belum ada produk yang dibeli.</p>
                            </div>`;
                        return;
                    }

                    orders.sort((a, b) => {
                        const timeA = a.createdAt || a.timestamp || 0;
                        const timeB = b.createdAt || b.timestamp || 0;
                        return timeB - timeA;
                    });

                    for (const data of orders) {
                        // MODIFIKASI: Penentuan status success/pending
                        const isSuccess = data.status === 'success' || data.status === 'completed';
                        
                        // Gunakan field 'judul' sesuai update terbaru Firestore/RTDB
                        const itemTitle = data.judul || data.judulProject || (data.kategori ? `Vocal ${data.kategori} (${data.jenisVocal})` : 'Pesanan Tanpa Judul');
                        
                        // PRIORITAS 1: Cek field "downloadlink" di Realtime Database (RTDB)
                        let currentDownloadLink = data.downloadlink || data.downloadLink || "";

                        // PRIORITAS 2: Jika di RTDB kosong & status success, cari ke data produk Firestore
                        if (isSuccess && !currentDownloadLink && data.judul) {
                            try {
                                // Mencocokkan field "judul" di RTDB dengan field "judul" di Firestore
                                const qFs = fsQuery(collection(db, "products"), where("judul", "==", data.judul));
                                const querySnapshot = await getDocs(qFs);
                                querySnapshot.forEach((doc) => {
                                    currentDownloadLink = doc.data().downloadlink;
                                });
                            } catch (e) {
                                console.error("Gagal ambil link Firestore:", e);
                            }
                        }
                        
                        const hasLink = currentDownloadLink && currentDownloadLink.trim() !== "";
                        const timestamp = data.createdAt || data.timestamp;
                        const dateFormatted = timestamp ? new Date(timestamp).toLocaleDateString('id-ID', {
                            day: 'numeric',
                            month: 'short',
                            year: 'numeric'
                        }) : '-';
                        
                        const queueText = data.antrian ? `<br><small style="color:#23C55E">Antrian: #${data.antrian}</small>` : '';

                        const cardHTML = `
                            <div class="order-card">
                                <div class="order-header">
                                    <div class="order-info">
                                        <h3>${itemTitle}</h3>
                                        <span class="order-date">${dateFormatted} ${queueText}</span>
                                    </div>
                                    <span class="status-badge ${isSuccess ? 'status-completed' : 'status-pending'}">
                                        ${data.status || 'pending'}
                                    </span>
                                </div>
                                
                                <div class="download-section">
                                    <div class="file-info">
                                        <i class="fa-solid ${isSuccess ? 'fa-check-circle' : 'fa-clock'}"></i>
                                        <span style="color: ${isSuccess ? '#FFFFFF' : '#636E7A'}">
                                            ${isSuccess ? (hasLink ? 'Produk Siap' : 'Link Belum Tersedia') : 'Menunggu Admin'}
                                        </span>
                                    </div>
                                    <a href="${isSuccess && hasLink ? currentDownloadLink : '#'}" 
                                       class="btn-download ${isSuccess && hasLink ? '' : 'disabled'}" 
                                       target="_blank">
                                       Unduh
                                    </a>
                                </div>
                            </div>
                        `;
                        orderContainer.insertAdjacentHTML('beforeend', cardHTML);
                    }
                };

                    loadAllOrders();

                } else {
                    window.location.href = "login.html";
                }
            });
    </script>
</body>
</html>
