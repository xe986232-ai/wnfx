<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FL Mobile - WNFX</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* BASE STYLE & COLORS */
        :root {
            --bg-main: #14171C;
            --accent-green: #23C55E;
            --text-main: #FFFFFF;
            --text-muted: #636E7A;
            --bg-card-hover: #090A0C;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            background: linear-gradient(180deg, #1A1E26 0%, var(--bg-main) 300px);
            min-height: 100vh;
            padding-bottom: 80px; /* Space for buy button */
            position: relative;
        }

        /* MODIFIKASI: Dekorasi Icon SVG (Fixed agar diam saat scroll) */
        .decor-icon {
            position: fixed; /* Berubah jadi fixed agar tidak ikut tergulung */
            z-index: 0;
            opacity: 0.05;
            filter: grayscale(1) invert(1);
            pointer-events: none;
        }
        .icon-1 { top: 150px; right: -20px; width: 80px; transform: rotate(15deg); }
        .icon-2 { top: 400px; left: -30px; width: 100px; transform: rotate(-20deg); }
        /* Menggunakan bottom agar tetap konsisten di area bawah layar */
        .icon-3 { bottom: 100px; right: 20px; width: 70px; transform: rotate(10deg); }


/* --- HEADER TERBARU (FIXED LOGO & SEARCH) --- */
header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px;
    position: sticky;
    top: 0;
    background-color: rgba(20, 23, 28, 0.9);
    backdrop-filter: blur(15px);
    z-index: 1000;
    overflow: hidden;
    min-height: 70px;
}

/* Pembungkus Logo & Teks */
.brand-wrapper {
    display: flex;
    align-items: center;
    gap: 10px;
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 102;
}

.brand {
    font-weight: 800;
    font-size: 20px;
    letter-spacing: 1px;
    color: var(--text-main);
}

.home-btn {
    z-index: 103;
    cursor: pointer;
    display: flex;
    align-items: center;
    transition: all 0.4s ease;
}

/* MODIFIKASI: Pencarian & Animasi */
.search-input-wrapper {
    position: absolute;
    left: 20px; /* Menempati posisi home-btn saat aktif */
    right: 60px;
    transform: translateX(150%);
    opacity: 0;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 101;
}

.search-input-wrapper input {
    width: 100%;
    background: #090A0C;
    border: 1px solid var(--accent-green);
    color: white;
    padding: 10px 15px;
    border-radius: 20px;
    outline: none;
    font-size: 14px;
}

.header-icons {
    display: flex;
    gap: 20px;
    z-index: 103;
}

.header-icons i {
    font-size: 18px;
    cursor: pointer;
    transition: color 0.3s;
}

/* --- LOGIKA ANIMASI SAAT SEARCHING (ACTIVE) --- */

/* Sembunyikan Home Button ke kiri */
header.searching .home-btn {
    transform: translateX(-100px);
    opacity: 0;
    pointer-events: none;
}

/* Sembunyikan Logo & Brand ke kiri */
header.searching .brand-wrapper {
    transform: translateX(-200%);
    opacity: 0;
    pointer-events: none;
}

/* Munculkan Input dari kanan */
header.searching .search-input-wrapper {
    transform: translateX(0);
    opacity: 1;
}


        /* SECTION TITLE */
        .section-info {
            padding: 20px;
            position: relative;
            z-index: 1;
            /* Masuk Animasi */
            animation: fadeInDown 0.8s ease backwards;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-info h1 {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .section-info p {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* NEW: GENRE FILTER STYLE */
        .genre-section {
            padding: 0 20px 10px 20px;
            position: relative;
            z-index: 1;
            animation: fadeIn 1s ease 0.2s backwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .genre-label {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 12px;
            color: var(--text-main);
        }

        .genre-container {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding-bottom: 10px;
            scrollbar-width: none; /* Firefox */
        }

        .genre-container::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        .genre-pill {
            padding: 8px 18px;
            background: #090A0C;
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            white-space: nowrap;
            cursor: pointer;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .genre-pill.active {
            background: var(--accent-green);
            color: white;
            border-color: var(--accent-green);
            transform: scale(1.05);
        }

        /* LIST PROJECT */
        .track-list {
            padding: 10px;
            position: relative;
            z-index: 1;
        }

        /* ANIMASI PER ITEM */
        .track-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-radius: 12px;
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 5px;
            background-color: transparent;
            border: 1px solid transparent;
            opacity: 0;
            transform: translateY(20px);
        }

        /* Class untuk memicu animasi masuk */
        .track-item.reveal {
            opacity: 1;
            transform: translateY(0);
        }

        /* Animasi Transisi Genre */
        .track-item.fade-out {
            opacity: 0;
            transform: scale(0.95);
            transition: 0.3s;
        }

        .track-item:hover {
            background-color: var(--bg-card-hover);
        }

        .track-item.selected {
            background-color: var(--bg-card-hover);
            border: 1px solid var(--accent-green);
        }

        /* THUMBNAIL */
        .thumb-box {
            position: relative;
            width: 55px;
            height: 55px;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .thumb-box img {
            width: 100%;
            height: 100%;
            border-radius: 6px;
            object-fit: cover;
            filter: brightness(0.6);
        }

        .play-trigger {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 30px;
            border: 2px solid rgba(255,255,255,0.8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.2);
            z-index: 2;
        }

        .play-trigger i {
            font-size: 12px;
            color: white;
            margin-left: 2px;
        }

        /* INFO AREA & SPECTRUM */
        .track-meta {
            flex-grow: 1;
            overflow: hidden;
            padding-right: 10px;
        }

        .name-row {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow: hidden; /* Penting untuk efek teks jalan */
        }

        .track-name-wrapper {
            overflow: hidden;
            white-space: nowrap;
            flex-grow: 1;
        }

        .track-name {
            font-weight: 600;
            font-size: 15px;
            display: inline-block;
        }

        /* Animasi Judul Panjang - Hanya jalan saat class .playing ada */
        .playing .marquee {
            display: inline-block;
            animation: marquee-scroll 10s linear infinite;
            padding-right: 50px;
        }

        @keyframes marquee-scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .track-sub {
            color: var(--text-muted);
            font-size: 13px;
        }

        /* SPECTRUM ANIMATION */
        .spectrum {
            display: none;
            align-items: flex-end;
            gap: 2px;
            height: 12px;
            width: 15px;
            flex-shrink: 0;
        }

        .playing .spectrum {
            display: flex;
        }

        .spectrum span {
            width: 3px;
            background: var(--accent-green);
            animation: bounce 0.5s ease infinite alternate;
        }

        .spectrum span:nth-child(2) { animation-delay: 0.2s; }
        .spectrum span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            from { height: 2px; }
            to { height: 100%; }
        }

        /* PRICE - UPDATED FOR DISCOUNT (STACKED) */
        .price-area {
            text-align: right;
            min-width: 60px;
            display: flex;
            flex-direction: column; /* Membuat susunan atas-bawah */
            align-items: flex-end;   /* Rata kanan */
            justify-content: center;
        }

        .price-text {
            color: var(--accent-green);
            font-weight: 800;
            font-size: 14px;
            display: block;         /* Memaksa tiap harga jadi baris baru */
            line-height: 1.2;
        }

        .price-sub {
            display: block;
            font-size: 9px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;        /* Jarak antara harga dan tulisan IDR */
        }


        /* ACTIVE STATE */
        .playing .track-name {
            color: var(--accent-green);
        }
        
        .playing .play-trigger {
            border-color: var(--accent-green);
        }

        .playing .play-trigger i {
            color: var(--accent-green);
            margin-left: 0;
        }

        /* TOMBOL BELI */
        .buy-action-area {
            position: fixed;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%) translateY(120px);
            z-index: 105;
            width: auto;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .buy-action-area.show {
            transform: translateX(-50%) translateY(0);
        }

        .btn-buy-now {
            background-color: var(--accent-green);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(35, 197, 94, 0.3);
            white-space: nowrap;
        }

        /* DETAIL OVERLAY (SAPU BERSIH - COMPACT) */
        .full-detail-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-main);
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            transform: translateY(100%);
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-x: hidden;
            overflow-y: auto;
        }

        .full-detail-overlay.active {
            transform: translateY(0);
        }

        .btn-close-detail {
            align-self: flex-start;
            padding: 15px 5px;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        .detail-avatar {
            width: 200px;
            height: 200px;
            max-width: 60vw;
            max-height: 60vw;
            border-radius: 15px;
            object-fit: cover;
            margin: 10px 0 25px 0;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
        }

        .detail-content {
            text-align: center;
            width: 100%;
            max-width: 100%;
        }

        .detail-title { 
            font-size: 22px; 
            font-weight: 800; 
            margin-bottom: 5px; 
line-height: 1.2;
            word-wrap: break-word;
        }
        
        .detail-artist { 
            font-size: 14px; 
            color: var(--text-muted); 
            margin-bottom: 15px; 
        }

        .detail-price { 
            font-size: 20px; 
            font-weight: 800; 
            color: var(--accent-green); 
            margin-bottom: 25px; 
        }

        /* MODIFIKASI: Input & Checkout UI */
        .checkout-form {
            width: 100%;
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 20px;
            text-align: left;
        }

        .checkout-form label {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: block;
        }

        .checkout-form input {
            width: 100%;
            background: #14171C;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px;
            border-radius: 12px;
            color: white;
            outline: none;
            margin-bottom: 15px;
        }

        .checkout-form input:focus {
            border-color: var(--accent-green);
        }

        .btn-checkout {
            width: 100%;
            background: var(--accent-green);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .detail-desc { 
            font-size: 13px; 
            line-height: 1.6; 
            color: #A0AAB4; 
            background: rgba(255,255,255,0.05); 
            padding: 20px; 
            border-radius: 15px; 
            text-align: left;
            margin-bottom: 30px;
            width: 100%;
        }
        /* --- MASUKKAN DI DALAM TAG <style> --- */

.audio-control-row {
    margin-top: 8px;
    display: flex;
    align-items: center;
    gap: 8px; /* Jarak antar elemen lebih rapat */
    width: 100%;
}

.seek-slider {
    flex-grow: 1;
    height: 3px; 
    background: rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    outline: none;
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
}

/* KHUSUS MENGECILKAN LINGKARAN (Thumb) */
.seek-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 8px;   
    height: 8px;  
    background: var(--accent-green);
    border-radius: 50%;
    cursor: pointer;
    border: none;
}

.seek-slider::-moz-range-thumb {
    width: 8px;
    height: 8px;
    background: var(--accent-green);
    border-radius: 50%;
    cursor: pointer;
    border: none;
}

.time-display {
    font-size: 10px;
    color: var(--text-muted);
    /* UPDATE: Posisi ditarik ke kiri */
    min-width: 35px;
    text-align: left;
    margin-right: 15px; /* Memberi ruang agar tidak menabrak harga di kanan */
}

/* Style untuk Baris Tombol di Overlay */
.action-buttons-row {
    display: flex;
    gap: 10px;
    width: 100%;
    margin-top: 10px;
}

.btn-share {
    background: rgba(255, 255, 255, 0.1);
    color: white;
    border: 1px solid rgba(255, 255, 255, 0.2);
    width: 50px; /* Ukuran tombol share lebih kecil/ikon saja */
    height: 50px;
    border-radius: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: all 0.3s ease;
}

.btn-share:active {
    transform: scale(0.9);
    background: var(--accent-green);
}

/* Penyesuaian agar tombol checkout mengambil sisa ruang */
.btn-checkout {
    flex-grow: 1; 
}
/* Container untuk tombol aksi di dalam overlay */
.detail-actions {
    display: flex;
    gap: 10px;
    width: 100%;
    margin-top: 5px;
}

.btn-share {
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 12px;
    width: 55px; /* Tombol share lebih kecil/kotak */
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: all 0.3s ease;
}

.btn-share:active {
    transform: scale(0.9);
    background: var(--accent-green);
}

.btn-share svg {
    width: 20px;
    height: 20px;
    fill: white;
}

/* Sesuaikan tombol checkout agar mengambil sisa ruang */
.btn-checkout {
    flex-grow: 1; 
}

    </style>
</head>
<body>

    <div class="app-container">
        <img src="https://cdn-icons-png.flaticon.com/512/2912/2912048.png" class="decor-icon icon-1" alt="decor">
        <img src="https://cdn-icons-png.flaticon.com/512/9320/9320256.png" class="decor-icon icon-2" alt="decor">
        <img src="https://cdn-icons-png.flaticon.com/512/18941/18941572.png" class="decor-icon icon-3" alt="decor">

<header id="mainHeader">
    <div class="home-btn" onclick="location.href='index.html'">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: white;">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
    </div>

    <div class="search-input-wrapper">
        <input type="text" id="searchInput" placeholder="Cari lagu..." onkeyup="doSearch()">
    </div>

    <div class="brand-wrapper">
        <div class="logo-box" style="width: 28px; height: 28px;">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <path d="M0,50 C0,5 5,0 50,0 C95,0 100,5 100,50 C100,95 95,100 50,100 C5,100 0,95 0,50" fill="#F5F5F5"/>
                <path d="M25,35 L40,65 L50,45 L60,65 L75,35" stroke="#14171C" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
        </div>
        <span class="brand">WNFX</span>
    </div>

    <div class="header-icons">
        <i class="fa-solid fa-magnifying-glass" onclick="toggleSearch()"></i>
    </div>
</header>
   <div class="section-info">
            <h1>FL Studio Mobile Project</h1>
            <p>projects created by wnfx</p>
        </div>

<div class="genre-section">
    <p class="genre-label" style="font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 10px;">Jenis</p>
    <div class="genre-container" style="margin-bottom: 20px;">
        <div class="genre-pill active" id="pill-all-price" onclick="filterByPrice('All', this)" style="padding: 7px 16px; font-size: 11px;">All</div>
        <div class="genre-pill" onclick="filterByPrice('FREE', this)" style="padding: 7px 16px; font-size: 11px;">FREE</div>
        <div class="genre-pill" onclick="filterByPrice('FOR SALE', this)" style="padding: 7px 16px; font-size: 11px;">FOR SALE</div>
    </div>


    <p class="genre-label" style="font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 10px;">Genre</p>
    <div class="genre-container" id="genreContainer" style="margin-bottom: 20px;">
        </div>

<p class="genre-label" style="font-size: 14px; text-transform: uppercase; letter-spacing: 1.5px; color: #FFFFFF; font-weight: 800; margin-top: 10px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;">
    PRODUK 
    <span id="productCount" style="font-size: 12px; color: var(--text-muted); font-weight: 400;">0 items</span>
</p>

</div>



        <div class="track-list" id="mainList">
            <p style="text-align: center; color: #636E7A; padding: 20px;">Memuat Produk...</p>
        </div>
    </div>

    <div class="buy-action-area" id="buyAction">
        <button class="btn-buy-now" onclick="openPurchaseDetail()">Beli Sekarang</button>

    <div class="full-detail-overlay" id="fullDetail">
        <div class="btn-close-detail" onclick="closePurchaseDetail()"><i class="fa-solid fa-arrow-left"></i></div>
        <img id="detImg" src="" class="detail-avatar" alt="Avatar">
        <div class="detail-content">
            <h2 id="detTitle" class="detail-title">Judul Lagu</h2>
            <p id="detArtist" class="detail-artist">Nama Artis</p>
            <p id="detPrice" class="detail-price">Harga</p>
            <div id="detDesc" class="detail-desc">Deskripsi</div>
            
<div class="checkout-form">
    <label>Nama Pelanggan</label>
    <input type="text" id="customerName" placeholder="Masukkan nama kamu...">
    
    <div class="detail-actions">
        <button class="btn-share" onclick="shareProductLink()" title="Share Link">
            <svg viewBox="0 0 24 24">
                <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"/>
            </svg>
        </button>
        
        <button class="btn-checkout" onclick="processCheckout()">
            <i class="fa-solid fa-cart-shopping"></i> Lanjut ke Pembayaran
        </button>
    </div>
</div>


    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

window.processCheckout = async () => {
    const customerName = document.getElementById('customerName').value;
    if (!customerName) return alert("Silakan masukkan nama pelanggan!");

    // AMBIL JUDUL ASLI DARI ATRIBUT data-judul
    if (!currentActiveItem) return;
    const title = currentActiveItem.querySelector('.track-name').getAttribute('data-judul');
    
    const priceText = document.getElementById('detPrice').innerText; // Mengambil text "30k IDR" atau "FREE IDR"
    
    // 1. Logika ekstraksi harga: Menghapus huruf, ambil angka saja, lalu kali 1000
    // Misal: "30k IDR" -> "30" -> 30000
    let rawPrice = 0;
    const isFree = priceText.includes('FREE');
    
    if (!isFree) {
        rawPrice = parseInt(priceText.replace(/[^0-9]/g, '')) * 1000;
    }
    
    if (!window.currentUser) {
        alert("Kamu harus login dulu!");
        window.location.href = "login.html";
        return;
    }

    try {
        // 2. Simpan record ke Realtime Database (RTDB)
        const ordersRef = ref(rtdb, 'orders');
        const newOrderRef = push(ordersRef);
        
        await set(newOrderRef, {
            userId: window.currentUser.uid,
            customerName: customerName,
            judul: title, // UPDATE: Field diubah dari judulProject menjadi judul
            harga: isFree ? "FREE" : rawPrice,
            kategori: "projects",
            status: isFree ? "success" : "pending",
            createdAt: serverTimestamp()
        });

        if (isFree) {
            // Jika GRATIS: Langsung ke riwayat
            alert("Produk gratis berhasil diklaim!");
            window.location.href = "riwayat.html";
        } else {
            // Jika BAYAR: Lari ke halaman pembayaran dengan data di URL
            // Format: pembayaran.html?harga=30000&layanan=Project: Judul Lagu
            const urlPayment = `payment.html?harga=${rawPrice}&layanan=${encodeURIComponent('Project: ' + title)}`;
            window.location.href = urlPayment;
        }

    } catch (error) {
        console.error("Gagal memproses data:", error);
        alert("Terjadi kesalahan teknis saat menyimpan pesanan.");
    }
};

function handleAudio(audioId, element) {
    const audio = document.getElementById(audioId);
    const icon = element.querySelector('.play-trigger i');

    document.querySelectorAll('.track-item').forEach(el => el.classList.remove('selected'));
    element.classList.add('selected');

    // Cek teks harga pada item yang diklik
    const priceText = element.querySelector('.price-text').innerText;
    const buyBtn = document.querySelector('.btn-buy-now');

    if (priceText === 'FREE') {
        buyBtn.innerText = 'I Want This';
    } else {
        buyBtn.innerText = 'Beli Sekarang';
    }

    document.getElementById('buyAction').classList.add('show');

    // JIKA PINDAH LAGU: Pause lagu lama dan balikkan ke awal
    if (currentActiveAudio && currentActiveAudio !== audio) {
        currentActiveAudio.pause();
        currentActiveAudio.currentTime = 0; // UPDATE: Balik ke awal
        window.updateProgress(currentActiveAudio.id); // UPDATE: Sinkronkan UI

        currentActiveItem.classList.remove('playing');
        currentActiveItem.querySelector('.play-trigger i').className = 'fa-solid fa-play';
    }

    if (audio.paused) {
        audio.play();
        element.classList.add('playing');
        icon.className = 'fa-solid fa-pause';
        currentActiveAudio = audio;
        currentActiveItem = element;
    } else {
        // JIKA PAUSE: Matikan dan balikkan ke awal
        audio.pause();
        audio.currentTime = 0; // UPDATE: Balik ke awal
        window.updateProgress(audioId); // UPDATE: Sinkronkan UI

        element.classList.remove('playing');
        icon.className = 'fa-solid fa-play';
    }

    audio.onended = function() {
        audio.currentTime = 0; // UPDATE: Balik ke awal saat tamat
        window.updateProgress(audioId); // UPDATE: Sinkronkan UI
        element.classList.remove('playing');
        icon.className = 'fa-solid fa-play';
    };
}

// Fungsi untuk update slider dan teks durasi
window.updateProgress = (audioId) => {
    const audio = document.getElementById(audioId);
    const slider = document.getElementById('seek_' + audioId.split('_')[1]);
    const timeDisplay = document.getElementById('time_' + audioId.split('_')[1]);
    
    if (audio.duration) {
        // Update Slider
        const value = (audio.currentTime / audio.duration) * 100;
        slider.value = value;
        
        // Update Teks Menit:Detik
        let mins = Math.floor(audio.currentTime / 60);
        let secs = Math.floor(audio.currentTime % 60);
        if (secs < 10) secs = '0' + secs;
        timeDisplay.innerText = `${mins}:${secs}`;
    }
};

// Fungsi geser progress (Seek)
window.seekAudio = (audioId, value) => {
    const audio = document.getElementById(audioId);
    const seekTo = audio.duration * (value / 100);
    audio.currentTime = seekTo;
};

// Fungsi mulai dari awal (Hanya Reset Posisi)
window.restartAudio = (audioId) => {
    const audio = document.getElementById(audioId);
    audio.currentTime = 0;
    
    // Memanggil updateProgress secara manual agar slider & teks durasi 
    // langsung berubah ke 0:00 meskipun lagu sedang di-pause.
    window.updateProgress(audioId);
};

window.shareProductLink = () => {
    if (!currentActiveItem) return;

    // 1. Ambil Judul asli
    const productTitle = currentActiveItem.querySelector('.track-name').getAttribute('data-judul');
    
    // 2. Ambil data-link dari Firebase
    let productSlug = currentActiveItem.getAttribute('data-link'); 
    
    // --- TAMBAHAN OTOMATIS (TANPA UBAH STRUKTUR LAMA) ---
    // Jika di Firebase kosong (null/empty), buat slug otomatis dari judul
    if (!productSlug || productSlug.trim() === "") {
        productSlug = productTitle.toLowerCase()
            .replace(/[^\w ]+/g, '') // Hapus simbol aneh
            .replace(/ +/g, '-');    // Ubah spasi jadi strip (-)
    }
    // --------------------------------------------------
    
    const baseUrl = window.location.origin + window.location.pathname;
    const finalUrl = `${baseUrl}?p=${productSlug}`;
    
    const shareText = `🔥 Cek Project FLM: "${productTitle}"\n\nProject keren dari WNFX ini bisa kamu cek di sini:`;

    if (navigator.share) {
        navigator.share({
            title: productTitle,
            text: shareText,
            url: finalUrl
        }).catch(console.error);
    } else {
        const fullMsg = `${shareText}\n${finalUrl}`;
        navigator.clipboard.writeText(fullMsg);
        alert("Pesan dan link produk berhasil disalin!");
    }
};
