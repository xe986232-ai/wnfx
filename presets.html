<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wnfx-Mix | FLM Presets Marketplace</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-black: #050505;
            --card-bg: #111111;
            --accent-mint: #00f3bc;
            --text-muted: #888;
            --border-dim: #222;
            --accent-gradient: linear-gradient(135deg, #e0ff99 0%, #00f3bc 100%);
            --shadow-glow: 0 8px 25px rgba(0, 243, 188, 0.25);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-black);
            color: #fff;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 110px;
            overflow-x: hidden;
        }

        .navbar {
            width: 100%; max-width: 480px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px; background: rgba(5, 5, 5, 0.85);
            backdrop-filter: blur(15px); position: sticky; top: 0; z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .brand { display: flex; align-items: center; font-size: 20px; font-weight: 800; color: #fff; text-transform: uppercase; }
        .brand span { color: var(--accent-mint); }

        .header-hero {
            width: 100%; max-width: 450px; padding: 40px 20px 25px;
            text-align: center;
        }
        .header-hero h1 {
            font-size: 28px; font-weight: 700; margin-bottom: 8px;
            background: linear-gradient(180deg, #fff 0%, #aaa 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .cat-scroll {
            width: 100%; max-width: 450px; display: flex; overflow-x: auto;
            gap: 10px; padding: 0 20px 20px; scrollbar-width: none;
        }
        .cat-scroll::-webkit-scrollbar { display: none; }
        .cat-bubble {
            padding: 10px 20px; border-radius: 25px; background: #151515;
            border: 1px solid #222; font-size: 12px; font-weight: 600;
            color: #888; white-space: nowrap; cursor: pointer; transition: 0.3s;
        }
        .cat-bubble.active { background: var(--accent-mint); color: #000; border-color: var(--accent-mint); box-shadow: 0 0 15px rgba(0, 243, 188, 0.3); }

        .preset-container {
            width: 100%; max-width: 450px; display: grid;
            grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 20px;
        }

        .preset-card {
            background: var(--card-bg); border-radius: 20px; border: 1px solid var(--border-dim);
            padding: 12px; position: relative; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: block;
            overflow: hidden; /* Tambahan agar konten tidak tumpah */
        }
        .preset-card.hidden { display: none; }

        .thumb {
            width: 100%; aspect-ratio: 1/1; background: #1a1a1a;
            border-radius: 14px; margin-bottom: 12px; position: relative;
            overflow: hidden; display: flex; align-items: center; justify-content: center;
        }
        .thumb img {
            width: 100%; height: 100%; object-fit: cover;
            border-radius: 14px;
            transform: scale(1.2); 
            transform-origin: center;
        }

        .badge {
            position: absolute; top: 8px; right: 8px; padding: 4px 8px;
            border-radius: 8px; font-size: 9px; font-weight: 800; text-transform: uppercase;
            z-index: 5;
        }
        .badge-free { background: var(--accent-mint); color: #000; }
        .badge-premium { background: #fff; color: #000; }

        .preset-info h4 { 
            font-size: 13px; font-weight: 700; margin-bottom: 4px; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            width: 100%;
            display: block; /* Memaksa elemen mematuhi lebar parent */
        }
        .preset-info p { font-size: 10px; color: #666; margin-bottom: 12px; }

        .btn-action {
            width: 100%; padding: 10px; border-radius: 12px; border: none;
            font-size: 11px; font-weight: 700; cursor: pointer; transition: 0.3s;
            text-align: center; display: block; text-decoration: none;
        }
        .btn-free { background: #222; color: #fff; }
        .btn-premium { background: var(--accent-gradient); color: #000; }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(10px);
            z-index: 10000; display: none; align-items: center; justify-content: center;
            padding: 20px;
        }
        .overlay-card {
            width: 100%; max-width: 400px; background: #111; border: 1px solid #333;
            border-radius: 30px; padding: 25px; position: relative;
            animation: slideUp 0.4s ease-out;
        }
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .close-btn { position: absolute; top: 20px; right: 20px; color: #666; font-size: 20px; cursor: pointer; }
        
        .overlay-thumb { width: 100px; height: 100px; border-radius: 20px; object-fit: cover; margin-bottom: 15px; }
        .overlay-title { font-size: 20px; font-weight: 800; margin-bottom: 5px; }
        .overlay-price { color: var(--accent-mint); font-weight: 700; font-size: 18px; margin-bottom: 20px; }
        
        .audio-preview {
            width: 100%; background: #1a1a1a; border-radius: 20px; padding: 15px;
            margin-bottom: 20px; display: flex; align-items: center; gap: 15px;
            border: 1px solid #222;
        }
        .play-pause-btn { 
            width: 45px; height: 45px; border-radius: 50%; background: var(--accent-mint);
            color: #000; display: flex; align-items: center; justify-content: center; 
            cursor: pointer; flex-shrink: 0; font-size: 18px;
            box-shadow: 0 0 15px rgba(0, 243, 188, 0.2);
        }
        .waveform {
            flex: 1; display: flex; align-items: center; gap: 3px; height: 30px;
        }
        .bar {
            flex: 1; height: 4px; background: #333; border-radius: 10px; transition: 0.2s;
        }
        .bar.active { background: var(--accent-mint); }

        .btn-final {
            width: 100%; padding: 16px; border-radius: 15px; border: none;
            font-weight: 800; font-size: 14px; cursor: pointer; text-transform: uppercase;
            background: var(--accent-gradient); color: #000; text-align: center; text-decoration: none; display: block;
        }

        .bottom-nav {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 500px; background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(20px); display: flex; justify-content: space-around;
            padding: 12px 0 25px; border-top: 1px solid rgba(255,255,255,0.1); z-index: 9999;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #666; text-decoration: none; font-size: 10px; }
        .nav-item.active { color: var(--accent-mint); }
        .nav-item i { font-size: 20px; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="brand">Wnfx<span>Presets</span></div>
        <div class="nav-right">
            <i class="fa-solid fa-magnifying-glass" style="margin-right: 15px;"></i>
            <i class="fa-solid fa-bag-shopping"></i>
        </div>
    </nav>

    <header class="header-hero">
        <h1>Pro FLM Presets</h1>
        <p style="color: #666; font-size: 14px;">Select category to filter presets</p>
    </header>

    <div class="cat-scroll">
        <div class="cat-bubble active" onclick="filterPresets('all', this)">All</div>
        <div class="cat-bubble" onclick="filterPresets('rack', this)">Preset Rack</div>
        <div class="cat-bubble" onclick="filterPresets('drumset', this)">Drumset</div>
        <div class="cat-bubble" onclick="filterPresets('gms', this)">GMS</div>
        <div class="cat-bubble" onclick="filterPresets('supersaw', this)">SuperSaw</div>
        <div class="cat-bubble" onclick="filterPresets('3xosc', this)">3xOsc</div>
        <div class="cat-bubble" onclick="filterPresets('minisynth', this)">MiniSynth</div>
    </div>

    <div class="preset-container" id="presetGrid"></div>

    <div class="overlay" id="productOverlay">
        <div class="overlay-card">
            <i class="fa-solid fa-circle-xmark close-btn" onclick="closeOverlay()"></i>
            <img id="overImg" src="" class="overlay-thumb">
            <h2 id="overTitle" class="overlay-title">Loading...</h2>
            <p id="overPrice" class="overlay-price">IDR 0</p>
            
            <div class="audio-preview">
                <div class="play-pause-btn" id="playBtn" onclick="toggleAudio()">
                    <i class="fa-solid fa-play" id="playIcon"></i>
                </div>
                <div class="waveform" id="waveformContainer">
                    </div>
            </div>

            <p id="audioStatus" style="font-size: 10px; color: var(--accent-mint); text-align: center; margin-bottom: 10px; font-weight: 600; display: none;">Playing...</p>

            <p style="font-size: 11px; color: #666; line-height: 1.6; margin-bottom: 25px;">
                Preset high-quality untuk FL Studio Mobile. Sudah siap pakai untuk project kamu.
            </p>

            <a href="#" id="finalBtn" class="btn-final">Get It Now</a>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fa-solid fa-house-chimney"></i><span>Home</span></a>
        <a href="produk.html" class="nav-item"><i class="fa-solid fa-layer-group"></i><span>Library</span></a>
        <a href="presets.html" class="nav-item active"><i class="fa-solid fa-wave-square"></i><span>Presets</span></a>
        <a href="profile.html" class="nav-item"><i class="fa-solid fa-circle-user"></i><span>Account</span></a>
    </nav>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "ISI_API_KEY",
            authDomain: "omwnfx1.firebaseapp.com",
            projectId: "omwnfx1",
            storageBucket: "omwnfx1.appspot.com",
            messagingSenderId: "SENDER_ID",
            appId: "APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const configKategori = {
            'drumset': { avatar: '1775901510900.png', label: 'Drumset' },
            'supersaw': { avatar: '1775901634620.png', label: 'SuperSaw' },
            'gms': { avatar: '1775971286015.png', label: 'GMS' },
            'minisynth': { avatar: 'assets/minisynth-default.png', label: 'MiniSynth' },
            '3xosc': { avatar: 'assets/3xosc-default.png', label: '3xOsc' },
            'preset_rack': { avatar: '1775972547106.png', label: 'Preset Rack' }
        };

        let currentAudio = new Audio();
        currentAudio.crossOrigin = "anonymous"; 

        const waveContainer = document.getElementById('waveformContainer');
        const barCount = 20;
        for(let i=0; i<barCount; i++){
            const bar = document.createElement('div');
            bar.className = 'bar';
            bar.style.height = (Math.random() * 15 + 5) + 'px';
            waveContainer.appendChild(bar);
        }

        function updateWaveform() {
            if (!currentAudio.paused) {
                const progress = (currentAudio.currentTime / currentAudio.duration) * barCount;
                const bars = document.querySelectorAll('.bar');
                bars.forEach((bar, index) => {
                    if (index < progress) {
                        bar.classList.add('active');
                        bar.style.height = (Math.random() * 20 + 10) + 'px';
                    } else {
                        bar.classList.remove('active');
                        bar.style.height = (Math.random() * 10 + 5) + 'px';
                    }
                });
                requestAnimationFrame(updateWaveform);
            }
        }

        function convertDriveLink(url) {
            if (!url) return url;
            if (url.includes('cloudinary.com')) return url;
            if (url.includes('drive.google.com')) {
                let fileId = "";
                try {
                    if (url.includes('/d/')) {
                        fileId = url.split('/d/')[1].split('/')[0].split('?')[0];
                    } else if (url.includes('id=')) {
                        fileId = url.split('id=')[1].split('&')[0];
                    }
                    return `https://docs.google.com/uc?export=download&id=${fileId}`;
                } catch (e) {
                    return url;
                }
            }
            return url;
        }

        async function fetchAllPresets() {
            const grid = document.getElementById('presetGrid');
            grid.innerHTML = ''; 

            for (const col in configKategori) {
                try {
                    const snapshot = await db.collection(col).get();
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        const isFree = data.harga === 0;
                        const categoryInfo = configKategori[col];
                        const filterCat = col === 'preset_rack' ? 'rack' : col;

                        const audioDirect = convertDriveLink(data.audio);
                        const fileDirect = convertDriveLink(data.dfile);

                        const cardHTML = `
                            <div class="preset-card" data-category="${filterCat}" onclick="openOverlay('${data.nama.replace(/'/g, "\\'")}', '${data.harga}', '${categoryInfo.avatar}', '${audioDirect}', '${fileDirect}')">
                                <div class="thumb">
                                    <div class="badge ${isFree ? 'badge-free' : 'badge-premium'}">
                                        ${isFree ? 'Free' : 'Premium'}
                                    </div>
                                    <img src="${categoryInfo.avatar}" alt="${categoryInfo.label}">
                                </div>
                                <div class="preset-info">
                                    <h4>${data.nama}</h4>
                                    <p>${categoryInfo.label} • FLM Preset</p>
                                    <button class="btn-action ${isFree ? 'btn-free' : 'btn-premium'}">
                                        ${isFree ? 'GET PRESET' : 'IDR ' + data.harga}
                                    </button>
                                </div>
                            </div>
                        `;
                        grid.insertAdjacentHTML('beforeend', cardHTML);
                    });
                } catch (err) {
                    console.error(`Error ambil data ${col}:`, err);
                }
            }
        }

        function openOverlay(name, price, img, audio, file) {
            document.getElementById('overTitle').innerText = name;
            document.getElementById('overPrice').innerText = price == 0 ? 'FREE' : 'IDR ' + price;
            document.getElementById('overImg').src = img;
            
            const finalBtn = document.getElementById('finalBtn');
            if (price == 0) {
                finalBtn.href = file;
                finalBtn.innerText = 'Download Free';
            } else {
                const waMessage = encodeURIComponent(`Halo Admin Wnfx, saya ingin membeli Preset: ${name} (IDR ${price})`);
                finalBtn.href = `https://wa.me/6281234567890?text=${waMessage}`;
                finalBtn.innerText = 'Purchase via WhatsApp';
            }

            document.querySelectorAll('.bar').forEach(b => {
                b.classList.remove('active');
                b.style.height = '10px';
            });

            currentAudio.src = audio;
            currentAudio.load(); 
            document.getElementById('productOverlay').style.display = 'flex';
        }

        function closeOverlay() {
            document.getElementById('productOverlay').style.display = 'none';
            currentAudio.pause();
            currentAudio.currentTime = 0;
            document.getElementById('playIcon').className = 'fa-solid fa-play';
            document.getElementById('audioStatus').style.display = 'none';
        }

        function toggleAudio() {
            const icon = document.getElementById('playIcon');
            const status = document.getElementById('audioStatus');
            
            if (currentAudio.paused) {
                currentAudio.play().then(() => {
                    icon.className = 'fa-solid fa-pause';
                    status.innerText = "Playing Audio...";
                    status.style.display = 'block';
                    updateWaveform();
                }).catch(e => {
                    console.error("Playback error:", e);
                });
            } else {
                currentAudio.pause();
                icon.className = 'fa-solid fa-play';
                status.innerText = "Paused";
            }
        }

        currentAudio.onended = () => { 
            document.getElementById('playIcon').className = 'fa-solid fa-play'; 
            document.getElementById('audioStatus').style.display = 'none';
            document.querySelectorAll('.bar').forEach(b => b.classList.remove('active'));
        };

        function filterPresets(category, element) {
            document.querySelectorAll('.cat-bubble').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            const cards = document.querySelectorAll('.preset-card');
            cards.forEach(card => {
                if (category === 'all' || card.getAttribute('data-category') === category) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            });
        }

        fetchAllPresets();
    </script>
</body>
</html>
